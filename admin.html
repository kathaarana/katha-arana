<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel | කතා අරණ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- SUPABASE -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>


    <style>

        .admin-page {
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .admin-container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .admin-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .admin-title h1 {
            margin: 0;
        }

        .admin-title p {
            color: #999;
            margin-top: 8px;
        }

        .admin-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .admin-card h2 {
            margin-top: 0;
        }

        .admin-form {
            display: grid;
            gap: 16px;
        }

        .admin-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .admin-form input,
        .admin-form textarea,
        .admin-form select {

            width: 100%;
            box-sizing: border-box;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(0,0,0,0.25);

            color: inherit;

            outline: none;
        }

        .admin-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        .admin-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-btn {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .admin-btn.primary {
            background: #ffffff;
            color: #111;
        }

        .admin-btn.danger {
            background: #7f1d1d;
            color: white;
        }

        .admin-btn.secondary {
            background: rgba(255,255,255,0.08);
            color: inherit;
        }

        .admin-story {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 16px;

            margin-bottom: 12px;

            border-radius: 14px;

            background: rgba(255,255,255,0.035);

            border: 1px solid rgba(255,255,255,0.06);
        }

        .admin-story-info h3 {
            margin: 0 0 6px;
        }

        .admin-story-info p {
            margin: 0 0 6px;
            color: #999;
        }

        .story-stats {
            color: #aaa;
            font-size: 14px;
        }

        .cover-preview {

            width: 180px;
            height: 240px;

            border-radius: 12px;

            border: 1px dashed rgba(255,255,255,0.2);

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            color: #888;

            margin-top: 10px;
        }

        .cover-preview img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .chapter-item {

            padding: 15px;

            margin-top: 10px;

            border-radius: 12px;

            background: rgba(255,255,255,0.035);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .status-message {

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            display: none;

            white-space: pre-wrap;
        }

        .hidden {
            display: none !important;
        }

        .logout-btn {
            background: #7f1d1d;
            color: white;
        }

        .rating-box {
            display: grid;
            gap: 8px;
        }

        .rating-help {
            color: #888;
            font-size: 13px;
        }

        @media (max-width: 700px) {

            .admin-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-story {
                flex-direction: column;
                align-items: flex-start;
            }

            .chapter-item {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     AUTH LOADING
===================================================== -->

<div
    id="authLoading"
    style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        color:#aaa;
        font-family:Arial,sans-serif;
    "
>

    🔐 Checking admin login...

</div>



<!-- =====================================================
     ADMIN CONTENT
===================================================== -->

<div
    id="adminContent"
    class="admin-page"
    style="display:none;"
>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            📚

            <span>
                කතා අරණ
            </span>

        </div>


        <nav>

            <a href="index.html">
                🏠 Website
            </a>

            <a
                href="#"
                id="logoutButton"
            >
                🚪 Logout
            </a>

        </nav>

    </header>



    <main class="admin-container">


        <!-- =================================================
             TITLE
        ================================================== -->

        <div class="admin-top">

            <div class="admin-title">

                <p class="label">
                    ADMIN PANEL
                </p>

                <h1>
                    📚 කතා කළමනාකරණය
                </h1>

                <p>
                    Stories සහ Chapters manage කරන්න.
                </p>

            </div>

        </div>



        <!-- =================================================
             STORY FORM
        ================================================== -->

        <section class="admin-card">

            <h2 id="storyFormTitle">
                ➕ අලුත් කතාවක්
            </h2>


            <form
                id="storyForm"
                class="admin-form"
            >


                <!-- TITLE -->

                <div>

                    <label for="storyTitle">
                        කතාවේ නම
                    </label>

                    <input
                        id="storyTitle"
                        type="text"
                        placeholder="උදා: සඳ එළියේ ආදරය"
                        required
                    >

                </div>



                <!-- AUTHOR -->

                <div>

                    <label for="storyAuthor">
                        Author
                    </label>

                    <input
                        id="storyAuthor"
                        type="text"
                        placeholder="කතුවරයා"
                    >

                </div>



                <!-- CATEGORY -->

                <div>

                    <label for="storyCategory">
                        Category
                    </label>

                    <select
                        id="storyCategory"
                    >

                        <option value="Romance">
                            ❤️ Romance
                        </option>

                        <option value="Horror">
                            👻 Horror
                        </option>

                        <option value="Mystery">
                            🔎 Mystery
                        </option>

                        <option value="Fantasy">
                            🧙 Fantasy
                        </option>

                        <option value="18+">
                            🔞 18+
                        </option>

                    </select>

                </div>



                <!-- DESCRIPTION -->

                <div>

                    <label for="storyDescription">
                        Description
                    </label>

                    <textarea
                        id="storyDescription"
                        placeholder="කතාව ගැන කෙටි විස්තරයක්..."
                    ></textarea>

                </div>



                <!-- RATING -->

                <div class="rating-box">

                    <label for="storyRating">
                        ⭐ Rating
                    </label>

                    <input
                        id="storyRating"
                        type="number"
                        min="0"
                        max="5"
                        step="0.1"
                        value="0"
                    >

                    <div class="rating-help">
                        0 - 5 අතර rating එකක් දාන්න.
                    </div>

                </div>



                <!-- COVER -->

                <div>

                    <label for="storyCover">
                        Cover Image
                    </label>

                    <input
                        id="storyCover"
                        type="file"
                        accept="image/*"
                    >


                    <div
                        id="coverPreview"
                        class="cover-preview"
                    >

                        🖼️ Preview

                    </div>

                </div>



                <!-- BUTTONS -->

                <div class="admin-buttons">

                    <button
                        type="submit"
                        class="admin-btn primary"
                        id="saveStoryButton"
                    >

                        💾 Save Story

                    </button>


                    <button
                        type="button"
                        id="cancelEdit"
                        class="admin-btn secondary hidden"
                    >

                        Cancel

                    </button>

                </div>



                <!-- MESSAGE -->

                <div
                    id="storyMessage"
                    class="status-message"
                ></div>


            </form>

        </section>



        <!-- =================================================
             STORIES
        ================================================== -->

        <section class="admin-card">

            <h2>
                📚 Published Stories
            </h2>


            <div id="storyList">

                Loading...

            </div>

        </section>



        <!-- =================================================
             CHAPTER EDITOR
        ================================================== -->

        <section
            id="chapterEditor"
            class="admin-card hidden"
        >

            <h2 id="chapterEditorTitle">
                📖 Chapters
            </h2>


            <form
                id="chapterForm"
                class="admin-form"
            >


                <!-- NUMBER -->

                <div>

                    <label for="chapterNumber">
                        Chapter Number
                    </label>

                    <input
                        id="chapterNumber"
                        type="number"
                        min="1"
                        required
                    >

                </div>



                <!-- TITLE -->

                <div>

                    <label for="chapterTitle">
                        Chapter Title
                    </label>

                    <input
                        id="chapterTitle"
                        type="text"
                        placeholder="Chapter title"
                        required
                    >

                </div>



                <!-- CONTENT -->

                <div>

                    <label for="chapterContent">
                        Chapter Content
                    </label>

                    <textarea
                        id="chapterContent"
                        placeholder="Chapter එකේ content එක..."
                        required
                    ></textarea>

                </div>



                <!-- BUTTONS -->

                <div class="admin-buttons">

                    <button
                        type="submit"
                        class="admin-btn primary"
                        id="saveChapterButton"
                    >

                        💾 Save Chapter

                    </button>


                    <button
                        type="button"
                        id="cancelChapterEdit"
                        class="admin-btn secondary hidden"
                    >

                        Cancel Edit

                    </button>


                    <button
                        type="button"
                        id="closeChapterEditor"
                        class="admin-btn secondary"
                    >

                        Close

                    </button>

                </div>

            </form>


            <div id="chapterList"></div>

        </section>


    </main>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


// =====================================================
// VARIABLES
// =====================================================

let editingStoryId = null;

let selectedStoryId = null;

let editingChapterId = null;

let selectedCoverFile = null;


// =====================================================
// ELEMENTS
// =====================================================

const adminContent =
    document.getElementById("adminContent");

const authLoading =
    document.getElementById("authLoading");

const storyForm =
    document.getElementById("storyForm");

const storyList =
    document.getElementById("storyList");

const storyMessage =
    document.getElementById("storyMessage");

const chapterEditor =
    document.getElementById("chapterEditor");

const coverPreview =
    document.getElementById("coverPreview");

const logoutButton =
    document.getElementById("logoutButton");

const storyCover =
    document.getElementById("storyCover");

const cancelEdit =
    document.getElementById("cancelEdit");

const chapterForm =
    document.getElementById("chapterForm");

const chapterList =
    document.getElementById("chapterList");

const closeChapterEditor =
    document.getElementById("closeChapterEditor");

const cancelChapterEdit =
    document.getElementById("cancelChapterEdit");


// =====================================================
// AUTH GUARD
// =====================================================

async function checkAdminLogin() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.auth.getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            window.location.replace(
                "admin-login.html"
            );

            return false;

        }


        if (
            !data ||
            !data.session
        ) {

            window.location.replace(
                "admin-login.html"
            );

            return false;

        }


        authLoading.style.display =
            "none";

        adminContent.style.display =
            "block";


        console.log(
            "✅ Admin authenticated"
        );


        return true;

    }

    catch (error) {

        console.error(
            "Auth error:",
            error
        );

        window.location.replace(
            "admin-login.html"
        );

        return false;

    }

}


// =====================================================
// LOGOUT
// =====================================================

logoutButton.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        await supabaseClient
            .auth
            .signOut();


        window.location.replace(
            "admin-login.html"
        );

    }
);


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    element,
    message
) {

    if (!element) {
        return;
    }


    element.style.display =
        "block";


    element.innerText =
        message;

}


// =====================================================
// COVER PREVIEW
// =====================================================

storyCover.addEventListener(
    "change",
    function(event) {

        const file =
            event.target.files[0];


        if (!file) {

            selectedCoverFile =
                null;

            return;

        }


        selectedCoverFile =
            file;


        const reader =
            new FileReader();


        reader.onload =
            function(e) {

                coverPreview.innerHTML = `

                    <img
                        src="${e.target.result}"
                        alt="Cover"
                    >

                `;

            };


        reader.readAsDataURL(file);

    }
);


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    const div =
        document.createElement("div");


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}


// =====================================================
// LOAD STORIES
// =====================================================

async function loadStories() {

    storyList.innerHTML =
        "⏳ Loading...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("stories")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(
            "Stories error:",
            error
        );


        storyList.innerHTML = `

            <p>
                ❌ Stories load කරන්න බැරි වුණා.
            </p>

            <small>
                ${escapeHTML(
                    error.message
                )}
            </small>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        storyList.innerHTML = `

            <p style="color:#888;">
                තවම Stories නැහැ.
            </p>

        `;

        return;

    }


    storyList.innerHTML =
        "";


    data.forEach(
        function(story) {

            const item =
                document.createElement("div");


            item.className =
                "admin-story";


            const views =
                Number(
                    story.views || 0
                );


            const rating =
                Number(
                    story.rating || 0
                );


            item.innerHTML = `

                <div class="admin-story-info">

                    <h3>
                        ${escapeHTML(
                            story.title ||
                            "Untitled"
                        )}
                    </h3>

                    <p>

                        ${escapeHTML(
                            story.category || ""
                        )}

                        ·

                        ${escapeHTML(
                            story.author ||
                            "Unknown"
                        )}

                    </p>

                    <div class="story-stats">

                        👁️ Views: ${views}

                        &nbsp;&nbsp;

                        ⭐ Rating: ${rating}

                    </div>

                </div>


                <div class="admin-buttons">

                    <button
                        class="admin-btn secondary"
                        data-action="chapters"
                        data-id="${escapeHTML(
                            story.id
                        )}"
                        type="button"
                    >

                        📖 Chapters

                    </button>


                    <button
                        class="admin-btn secondary"
                        data-action="edit"
                        data-id="${escapeHTML(
                            story.id
                        )}"
                        type="button"
                    >

                        ✏️ Edit

                    </button>


                    <button
                        class="admin-btn danger"
                        data-action="delete"
                        data-id="${escapeHTML(
                            story.id
                        )}"
                        type="button"
                    >

                        🗑️ Delete

                    </button>

                </div>

            `;


            storyList.appendChild(
                item
            );

        }
    );

}


// =====================================================
// STORY BUTTON ACTIONS
// =====================================================

storyList.addEventListener(
    "click",
    async function(event) {

        const button =
            event.target.closest("button");


        if (!button) {
            return;
        }


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        if (
            action === "edit"
        ) {

            await editStory(id);

        }


        if (
            action === "delete"
        ) {

            await deleteStory(id);

        }


        if (
            action === "chapters"
        ) {

            await openChapterEditor(id);

        }

    }
);


// =====================================================
// SAVE STORY
// =====================================================

storyForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const saveButton =
            document.getElementById(
                "saveStoryButton"
            );


        const title =
            document
                .getElementById("storyTitle")
                .value
                .trim();


        const author =
            document
                .getElementById("storyAuthor")
                .value
                .trim();


        const category =
            document
                .getElementById("storyCategory")
                .value;


        const description =
            document
                .getElementById("storyDescription")
                .value
                .trim();


        const rating =
            Number(
                document
                    .getElementById("storyRating")
                    .value
            );


        if (
            Number.isNaN(rating) ||
            rating < 0 ||
            rating > 5
        ) {

            showMessage(
                storyMessage,
                "❌ Rating එක 0 - 5 අතර දාන්න."
            );

            return;

        }


        try {

            saveButton.disabled =
                true;


            showMessage(
                storyMessage,
                "⏳ Saving Story..."
            );


            let coverURL =
                null;


            // =================================================
            // UPLOAD COVER
            // =================================================

            if (selectedCoverFile) {

                const extension =
                    selectedCoverFile.name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const fileName =
                    "cover_" +
                    Date.now() +
                    "_" +
                    Math.random()
                        .toString(36)
                        .substring(2, 8) +
                    "." +
                    extension;


                const {
                    error:
                        uploadError
                } =
                    await supabaseClient
                        .storage
                        .from("story-covers")
                        .upload(
                            fileName,
                            selectedCoverFile,
                            {
                                upsert: false
                            }
                        );


                if (uploadError) {

                    throw uploadError;

                }


                const {
                    data:
                        publicData
                } =
                    supabaseClient
                        .storage
                        .from("story-covers")
                        .getPublicUrl(
                            fileName
                        );


                coverURL =
                    publicData.publicUrl;

            }


            // =================================================
            // EDIT STORY
            // =================================================

            if (editingStoryId) {

                const updateData = {

                    title:
                        title,

                    author:
                        author,

                    category:
                        category,

                    description:
                        description,

                    rating:
                        rating

                };


                if (coverURL) {

                    updateData.cover =
                        coverURL;

                }


                const {
                    error
                } =
                    await supabaseClient
                        .from("stories")
                        .update(
                            updateData
                        )
                        .eq(
                            "id",
                            editingStoryId
                        );


                if (error) {

                    throw error;

                }


                showMessage(
                    storyMessage,
                    "✅ Story updated successfully!"
                );

            }


            // =================================================
            // NEW STORY
            // =================================================

            else {

                const {
                    error
                } =
                    await supabaseClient
                        .from("stories")
                        .insert({

                            title:
                                title,

                            author:
                                author,

                            category:
                                category,

                            description:
                                description,

                            cover:
                                coverURL,

                            views:
                                0,

                            rating:
                                rating

                        });


                if (error) {

                    throw error;

                }


                showMessage(
                    storyMessage,
                    "✅ Story published successfully! 📚"
                );

            }


            resetStoryForm();

            await loadStories();

        }

        catch (error) {

            console.error(
                "Save story error:",
                error
            );


            showMessage(
                storyMessage,
                "❌ Error: " +
                error.message
            );

        }

        finally {

            saveButton.disabled =
                false;

        }

    }
);


// =====================================================
// EDIT STORY
// =====================================================

async function editStory(id) {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("stories")
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


    if (error) {

        alert(
            "❌ " +
            error.message
        );

        return;

    }


    editingStoryId =
        data.id;


    document.getElementById(
        "storyFormTitle"
    ).innerText =
        "✏️ Story Edit";


    document.getElementById(
        "storyTitle"
    ).value =
        data.title || "";


    document.getElementById(
        "storyAuthor"
    ).value =
        data.author || "";


    document.getElementById(
        "storyCategory"
    ).value =
        data.category || "Romance";


    document.getElementById(
        "storyDescription"
    ).value =
        data.description || "";


    document.getElementById(
        "storyRating"
    ).value =
        data.rating || 0;


    selectedCoverFile =
        null;


    storyCover.value =
        "";


    if (data.cover) {

        coverPreview.innerHTML = `

            <img
                src="${escapeHTML(
                    data.cover
                )}"
                alt="Cover"
            >

        `;

    }
    else {

        coverPreview.innerHTML =
            "🖼️ Preview";

    }


    cancelEdit
        .classList
        .remove("hidden");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// =====================================================
// DELETE STORY
// =====================================================

async function deleteStory(id) {

    const ok =
        confirm(
            "⚠️ මේ Story එක සහ එහි Chapters සියල්ල delete කරන්නද?"
        );


    if (!ok) {
        return;
    }


    // Delete chapters first

    const {
        error:
            chapterError
    } =
        await supabaseClient
            .from("chapters")
            .delete()
            .eq(
                "story_id",
                id
            );


    if (chapterError) {

        alert(
            "❌ Chapter delete error:\n" +
            chapterError.message
        );

        return;

    }


    // Delete story

    const {
        error
    } =
        await supabaseClient
            .from("stories")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            "❌ Story delete error:\n" +
            error.message
        );

        return;

    }


    await loadStories();


    alert(
        "✅ Story එක delete කළා."
    );

}

cancelEdit.addEventListener(

// =====================================================
// OPEN CHAPTER EDITOR
// =====================================================

async function openChapterEditor(
    storyId
) {

    selectedStoryId =
        storyId;


    editingChapterId =
        null;


    const {
        data: story,
        error
    } =
        await supabaseClient
            .from("stories")
            .select("title")
            .eq(
                "id",

            )
            .single();


    if (error) {

        alert(
            "❌ " +
            error.message
        );

        return;

    }


    document.getElementById(
        "chapterEditorTitle"

        "📖 " +
        (story.title || "Story") +
        " — Chapters";

    await loadChapters();


    chapterEditor.scrollIntoView({

    });

// =====================================================
// SAVE CHAPTER
// =====================================================

chapterForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        if (!selectedStoryId) {

            alert(
                "❌ Story එකක් තෝරන්න."
            );

            return;

        }


        const saveButton =
            document.getElementById(
                "saveChapterButton"
            );


        const number =
            Number(
                document
                    .getElementById(
                        "chapterNumber"
                    )
                    .value
            );


        const title =
            document
                .getElementById(
                    "chapterTitle"
                )
                .value
                .trim();


        const content =
            document
                .getElementById(
                    "chapterContent"
                )
                .value
                .trim();


        if (
            !number ||
            number < 1
        ) {

            alert(
                "Chapter Number එක නිවැරදිව දාන්න."
            );

            return;

        }


        if (!title) {

            alert(
                "Chapter Title එක දාන්න."
            );

            return;

        }


        if (!content) {

            alert(
                "Chapter Content එක දාන්න."
            );

            return;

        }


        try {

            saveButton.disabled =
                true;


            saveButton.innerText =
                "⏳ Saving...";


            let error = null;


            // =================================================
            // EDIT EXISTING CHAPTER
            // =================================================

            if (editingChapterId) {

                const result =
                    await supabaseClient
                        .from("chapters")
                        .update({

                            number:
                                number,

                            title:
                                title,

                            content:
                                content

                        })
                        .eq(
                            "id",
                            editingChapterId
                        );


                error =
                    result.error;

            }


            // =================================================
            // NEW CHAPTER
            // =================================================

            else {

                const {
                    data: existing,
                    error:
                        findError
                } =
                    await supabaseClient
                        .from("chapters")
                        .select("id")
                        .eq(
                            "story_id",
                            selectedStoryId
                        )
                        .eq(
                            "number",
                            number
                        )
                        .maybeSingle();


                if (findError) {

                    throw findError;

                }


                if (existing) {

                    alert(
                        "⚠️ මේ Chapter Number එක දැනටමත් තියෙනවා.\n\nEdit කරන්න Chapters list එකෙන් ✏️ Edit තෝරන්න."
                    );

                    return;

                }


                const result =
                    await supabaseClient
                        .from("chapters")
                        .insert({

                            story_id:
                                selectedStoryId,

                            number:
                                number,

                            title:
                                title,

                            content:
                                content

                        });


                error =
                    result.error;

            }


            if (error) {

                throw error;

            }


            resetChapterForm();


            await loadChapters();


            alert(
                "✅ Chapter එක Save කළා! 📖"
            );

        }

        catch (error) {

            console.error(
                "Save chapter error:",
                error
            );


            alert(
                "❌ Error:\n" +
                error.message
            );

        }

        finally {

            saveButton.disabled =
                false;

            saveButton.innerText =
                "💾 Save Chapter";

        }

    }
);


// =====================================================
// LOAD CHAPTERS
// =====================================================

async function loadChapters() {

    if (!selectedStoryId) {
        return;
    }


    chapterList.innerHTML =
        "⏳ Chapters loading...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("chapters")
            .select("*")
            .eq(
                "story_id",
                selectedStoryId
            )
            .order(
                "number",
                {
                    ascending: true
                }
            );


    if (error) {

        chapterList.innerHTML = `

            <p>

                ❌ ${escapeHTML(
                    error.message
                )}

            </p>

        `;

        return;

    }


    chapterList.innerHTML =
        "";


    if (
        !data ||
        data.length === 0
    ) {

        chapterList.innerHTML = `

            <p style="color:#888;">

                තවම Chapters නැහැ. 📖

            </p>

        `;

        return;

    }


    data.forEach(
        function(chapter) {

            const item =
                document.createElement("div");


            item.className =
                "chapter-item";


            item.innerHTML = `

                <div>

                    <strong>

                        Chapter
                        ${escapeHTML(
                            chapter.number
                        )}

                    </strong>

                    —

                    ${escapeHTML(
                        chapter.title ||
                        "Untitled"
                    )}

                </div>


                <div class="admin-buttons">

                    <button
                        class="admin-btn secondary"
                        type="button"
                        data-edit-chapter="${escapeHTML(
                            chapter.id
                        )}"
                    >

                        ✏️ Edit

                    </button>


                    <button
                        class="admin-btn danger"
                        type="button"
                        data-delete-chapter="${escapeHTML(
                            chapter.id
                        )}"
                    >

                        🗑️ Delete

                    </button>

                </div>

            `;


            const editButton =
                item.querySelector(
                    "[data-edit-chapter]"
                );


            const deleteButton =
                item.querySelector(
                    "[data-delete-chapter]"
                );


            editButton.addEventListener(
                "click",
                function() {

                    editChapter(
                        chapter
                    );

                }
            );


            deleteButton.addEventListener(
                "click",
                function() {

                    deleteChapter(
                        chapter.id
                    );

                }
            );


            chapterList.appendChild(
                item
            );

        }
    );

}


// =====================================================
// EDIT CHAPTER
// =====================================================

function editChapter(chapter) {

    editingChapterId =
        chapter.id;


    document.getElementById(
        "chapterNumber"
    ).value =
        chapter.number || "";


    document.getElementById(
        "chapterTitle"
    ).value =
        chapter.title || "";


    document.getElementById(
        "chapterContent"
    ).value =
        chapter.content || "";


    cancelChapterEdit
        .classList
        .remove("hidden");


    document.getElementById(
        "saveChapterButton"
    ).innerText =
        "💾 Update Chapter";


    chapterEditor.scrollIntoView({
        behavior: "smooth"
    });

}


// =====================================================
// RESET CHAPTER FORM
// =====================================================

function resetChapterForm() {

    editingChapterId =
        null;


    chapterForm.reset();


    cancelChapterEdit
        .classList
        .add("hidden");


    document.getElementById(
        "saveChapterButton"
    ).innerText =
        "💾 Save Chapter";

}


// =====================================================
// CANCEL CHAPTER EDIT
// =====================================================

cancelChapterEdit.addEventListener(
    "click",
    function() {

        resetChapterForm();

    }
);


// =====================================================
// DELETE CHAPTER
// =====================================================

async function deleteChapter(id) {

    const ok =
        confirm(
            "⚠️ මේ Chapter එක delete කරන්නද?"
        );


    if (!ok) {
        return;
    }


    const {
        error
    } =
        await supabaseClient
            .from("chapters")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            "❌ " +
            error.message
        );

        return;

    }


    if (
        String(editingChapterId)
        ===
        String(id)
    ) {

        resetChapterForm();

    }


    await loadChapters();


    alert(
        "✅ Chapter එක delete කළා."
    );

}


// =====================================================
// CLOSE CHAPTER EDITOR
// =====================================================

closeChapterEditor.addEventListener(

        chapterEditor
            .classList
            .add("hidden");


        selectedStoryId =
            null;


        editingChapterId =
            null;


        resetChapterForm();

    }
);

})();
