<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Admin Panel | කතා අරණ</title>

        rel="stylesheet"
        href="style.css"
    >

    <!-- SUPABASE -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="supabase.js"></script>


    <style>

        .admin-page {
            min-height: 100vh;
            padding-bottom: 80px;
        }

        .admin-container {
            max-width: 1100px;
            margin: auto;
            padding: 40px 20px;
        }

        .admin-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .admin-title h1 {
            margin: 0;
        }

        .admin-title p {
            color: #999;
            margin-top: 8px;
        }

        .admin-card {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 18px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .admin-card h2 {
            margin-top: 0;
        }

        .admin-form {
            display: grid;
            gap: 16px;
        }

        .admin-form label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        .admin-form input,
        .admin-form textarea,
        .admin-form select {

            width: 100%;
            box-sizing: border-box;

            padding: 13px 15px;

            border-radius: 10px;

            border: 1px solid
                rgba(255,255,255,0.12);

            background:
                rgba(0,0,0,0.25);

            color: inherit;

            outline: none;
        }

        .admin-form textarea {
            min-height: 150px;
            resize: vertical;
        }

        .admin-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .admin-btn {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
        }

        .admin-btn.primary {
            background: #ffffff;
            color: #111;
        }

        .admin-btn.danger {
            background: #7f1d1d;
            color: white;
        }

        .admin-btn.secondary {
            background: rgba(255,255,255,0.08);
            color: inherit;
        }

        .admin-story {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 20px;

            padding: 16px;

            margin-bottom: 12px;

            border-radius: 14px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.06);
        }

        .admin-story-info h3 {
            margin: 0 0 6px;
        }

        .admin-story-info p {
            margin: 0;
            color: #999;
        }

        .cover-preview {

            width: 180px;
            height: 240px;

            border-radius: 12px;

            border:
                1px dashed
                rgba(255,255,255,0.2);

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            color: #888;

            margin-top: 10px;
        }

        .cover-preview img {

            width: 100%;
            height: 100%;

            object-fit: cover;
        }

        .chapter-item {

            padding: 15px;

            margin-top: 10px;

            border-radius: 12px;

            background:
                rgba(255,255,255,0.035);

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }

        .status-message {

            margin-top: 15px;

            padding: 12px;

            border-radius: 10px;

            display: none;
        }

        .hidden {
            display: none !important;
        }

        .logout-btn {
            background: #7f1d1d;
            color: white;
        }

        @media (max-width: 700px) {

            .admin-top {
                flex-direction: column;
                align-items: flex-start;
            }

            .admin-story {
                flex-direction: column;
                align-items: flex-start;
            }

            .chapter-item {
                flex-direction: column;
                align-items: flex-start;
            }

        }

    </style>

</head>


<body>


<!-- =====================================================
     AUTH LOADING
===================================================== -->

<div

    style="

        align-items:center;

        font-family:Arial,sans-serif;
    "
>

    🔐 Checking admin login...

</div>



<!-- =====================================================
     ADMIN CONTENT
===================================================== -->

<div
    id="adminContent"
    class="admin-page"
    style="display:none;"
>


    <!-- HEADER -->

    <header class="header">

        <div class="logo">

            📚

        </div>


        <nav>

            <a href="index.html">

            </a>

            <a
                href="#"

            </a>

    </header>



    <main class="admin-container">

        <!-- =================================================
             STORIES
        ================================================== -->

        <section class="admin-card">

            <h2>
                📚 Published Stories
            </h2>

                Loading...

            </div>

        <!-- =================================================
             CHAPTER EDITOR
        ================================================== -->

        <section

                        required
                    >

                    <label for="chapterContent">
                        Chapter Content

                        id="chapterContent"
                        placeholder="Chapter එකේ content එක..."
                        required
                    ></textarea>

                <div class="admin-buttons">

                    <button
                        type="submit"
                        class="admin-btn primary"
                    >

                        💾 Save Chapter

                    </button>


                    <button

                        id="closeChapterEditor"

    </main>

</div>



<!-- =====================================================
     JAVASCRIPT
===================================================== -->

<script>


// =====================================================
// VARIABLES
// =====================================================

let editingStoryId = null;

let selectedStoryId = null;

let selectedCoverFile = null;


// =====================================================
// ELEMENTS
// =====================================================

const adminContent =
    document.getElementById(
        "adminContent"
    );

const authLoading =
    document.getElementById(
        "authLoading"
    );

const storyForm =
    document.getElementById(
        "storyForm"
    );

const storyList =
    document.getElementById(
        "storyList"
    );

const storyMessage =
    document.getElementById(
        "storyMessage"
    );

const chapterEditor =
    document.getElementById(
        "chapterEditor"
    );

const coverPreview =
    document.getElementById(
        "coverPreview"
    );

const logoutButton =
    document.getElementById(
        "logoutButton"
    );


// =====================================================
// AUTH GUARD
// =====================================================

async function checkAdminLogin() {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .auth
                .getSession();


        if (error) {

            console.error(
                "Session error:",
                error
            );

            window.location.replace(
                "admin-login.html"
            );

            return false;

        }


        if (
            !data ||
            !data.session
        ) {

            window.location.replace(
                "admin-login.html"
            );

            return false;

        }


        console.log(
            "✅ Admin authenticated"
        );


        authLoading.style.display =
            "none";

        adminContent.style.display =
            "block";


        return true;

    }
    catch (error) {

        console.error(
            "Auth error:",
            error
        );

        window.location.replace(
            "admin-login.html"
        );

        return false;

    }

}


// =====================================================
// LOGOUT
// =====================================================

logoutButton.addEventListener(
    "click",
    async function(event) {

        event.preventDefault();


        await supabaseClient
            .auth
            .signOut();


        window.location.replace(
            "admin-login.html"
        );

    }
);


// =====================================================
// MESSAGE
// =====================================================

function showMessage(
    element,
    message
) {

    element.style.display =
        "block";

    element.innerText =
        message;

}


// =====================================================
// COVER PREVIEW
// =====================================================

document
    .getElementById("storyCover")
    .addEventListener(
        "change",
        function(event) {

            const file =
                event.target.files[0];


            if (!file) {

                selectedCoverFile =
                    null;

                coverPreview.innerHTML =
                    "🖼️ Preview";

                return;

            }


            selectedCoverFile =
                file;


            const reader =
                new FileReader();


            reader.onload =
                function(e) {

                    coverPreview.innerHTML = `

                        <img
                            src="${e.target.result}"
                            alt="Cover"
                        >

                    `;

                };


            reader.readAsDataURL(file);

        }
    );


// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}


// =====================================================
// LOAD STORIES
// =====================================================

async function loadStories() {

    storyList.innerHTML =
        "Loading...";


    const {
        data,
        error
    } =
        await supabaseClient
            .from("stories")
            .select("*")
            .order(
                "id",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);


        storyList.innerHTML = `

            <p>
                ❌ Stories load කරන්න බැරි වුණා.
            </p>

            <small>
                ${escapeHTML(
                    error.message
                )}
            </small>

        `;

        return;

    }


    if (
        !data ||
        data.length === 0
    ) {

        storyList.innerHTML = `

            <p style="color:#888;">
                තවම Stories නැහැ.
            </p>

        `;

        return;

    }


    storyList.innerHTML =
        "";


    data.forEach(
        function(story) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "admin-story";


            item.innerHTML = `

                <div class="admin-story-info">

                    <h3>
                        ${escapeHTML(
                            story.title
                        )}
                    </h3>

                    <p>

                        ${escapeHTML(
                            story.category || ""
                        )}

                        ·

                        ${escapeHTML(
                            story.author || "Unknown"
                        )}

                    </p>

                </div>


                <div class="admin-buttons">

                    <button
                        class="admin-btn secondary"
                        data-action="chapters"
                        data-id="${escapeHTML(
                            story.id
                        )}"
                    >

                        📖 Chapters

                    </button>


                    <button
                        class="admin-btn secondary"
                        data-action="edit"
                        data-id="${escapeHTML(
                            story.id
                        )}"
                    >

                        ✏️ Edit

                    </button>


                    <button
                        class="admin-btn danger"
                        data-action="delete"
                        data-id="${escapeHTML(
                            story.id
                        )}"
                    >

                        🗑️ Delete

                    </button>

                </div>

            `;


            storyList.appendChild(
                item
            );

        }
    );

}


// =====================================================
// STORY BUTTON ACTIONS
// =====================================================

storyList.addEventListener(
    "click",
    async function(event) {

        const button =
            event.target.closest(
                "button"
            );


        if (!button) {
            return;
        }


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        if (
            action === "edit"
        ) {

            await editStory(id);

        }


        if (
            action === "delete"
        ) {

            await deleteStory(id);

        }


        if (
            action === "chapters"
        ) {

            await openChapterEditor(id);

        }

    }
);


// =====================================================
// SAVE STORY
// =====================================================

storyForm.addEventListener(
    "submit",
    async function(event) {

        event.preventDefault();


        const title =
            document
                .getElementById(
                    "storyTitle"
                )
                .value
                .trim();


        const author =
            document
                .getElementById(
                    "storyAuthor"
                )
                .value
                .trim();


        const category =
            document
                .getElementById(
                    "storyCategory"
                )
                .value;


        const description =
            document
                .getElementById(
                    "storyDescription"
                )
                .value
                .trim();


        try {

            showMessage(
                storyMessage,
                "⏳ Saving..."
            );


            let coverURL =
                null;


            // =================================================
            // UPLOAD COVER
            // =================================================

            if (selectedCoverFile) {

                const extension =
                    selectedCoverFile
                        .name
                        .split(".")
                        .pop()
                        .toLowerCase();


                const fileName =
                    "cover_" +
                    Date.now() +
                    "." +
                    extension;


                const {
                    error:
                        uploadError
                } =
                    await supabaseClient
                        .storage
                        .from(
                            "story-covers"
                        )
                        .upload(
                            fileName,
                            selectedCoverFile,
                            {
                                upsert:
                                    false
                            }
                        );


                if (uploadError) {

                    throw uploadError;

                }


                const {
                    data:
                        publicData
                } =
                    supabaseClient
                        .storage
                        .from(
                            "story-covers"
                        )
                        .getPublicUrl(
                            fileName
                        );


                coverURL =
                    publicData.publicUrl;

            }


            // =================================================
            // EDIT
            // =================================================

            if (editingStoryId) {

                const updateData = {

                    title:
                        title,

                    author:
                        author,

                    category:
                        category,

                    description:
                        description

                };


                if (coverURL) {

                    updateData.cover =
                        coverURL;

                }


                const {
                    error
                } =
                    await supabaseClient
                        .from("stories")
                        .update(
                            updateData
                        )
                        .eq(
                            "id",
                            editingStoryId
                        );


                if (error) {

                    throw error;

                }


                showMessage(
                    storyMessage,
                    "✅ Story updated!"
                );

            }


            // =================================================
            // NEW STORY
            // =================================================

            else {

                const {
                    error
                } =
                    await supabaseClient
                        .from("stories")
                        .insert({

                            title:
                                title,

                            author:
                                author,

                            category:
                                category,

                            description:
                                description,

                            cover:
                                coverURL,

                            views:
                                0,

                            rating:
                                0,

                            liked:
                                0

                        });


                if (error) {

                    throw error;

                }


                showMessage(
                    storyMessage,
                    "✅ Story published!"
                );

            }


            resetStoryForm();

            await loadStories();

        }
        catch (error) {

            console.error(error);


            showMessage(
                storyMessage,
                "❌ Error: " +
                error.message
            );

        }

    }
);


// =====================================================
// EDIT STORY
// =====================================================

async function editStory(id) {

    const {
        data,
        error
    } =
        await supabaseClient
            .from("stories")
            .select("*")
            .eq(
                "id",
                id
            )
            .single();


    if (error) {

        alert(
            error.message
        );

        return;

    }


    editingStoryId =
        data.id;


    document.getElementById(
        "storyTitle"
    ).value =
        data.title || "";


    document.getElementById(
        "storyAuthor"
    ).value =
        data.author || "";


    document.getElementById(
        "storyCategory"
    ).value =
        data.category || "Romance";


    document.getElementById(
        "storyDescription"
    ).value =
        data.description || "";


    if (data.cover) {

        coverPreview.innerHTML = `

            <img
                src="${escapeHTML(
                    data.cover
                )}"
                alt="Cover"
            >

        `;

    }


    document.getElementById(
        "cancelEdit"
    ).classList.remove(
        "hidden"
    );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


// =====================================================
// DELETE STORY
// =====================================================

async function deleteStory(id) {

    const ok =
        confirm(
            "මේ Story එක සහ එහි Chapters delete කරන්නද?"
        );


    if (!ok) {
        return;
    }


    const {
        error:
            chapterError
    } =
        await supabaseClient
            .from("chapters")
            .delete()
            .eq(
                "story_id",
                id
            );


    if (chapterError) {

        alert(
            chapterError.message
        );

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("stories")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadStories();


    alert(
        "Story එක delete කළා. 🗑️"
    );

}


// =====================================================
// RESET STORY FORM
// =====================================================

function resetStoryForm() {

    editingStoryId =
        null;


    selectedCoverFile =
        null;


    storyForm.reset();


    coverPreview.innerHTML =
        "🖼️ Preview";


    document.getElementById(
        "cancelEdit"
    ).classList.add(
        "hidden"
    );

}


// =====================================================
// CANCEL EDIT
// =====================================================

document
    .getElementById(
        "cancelEdit"
    )
    .addEventListener(
        "click",
        resetStoryForm
    );


// =====================================================
// OPEN CHAPTER EDITOR
// =====================================================

async function openChapterEditor(
    storyId
) {

    selectedStoryId =
        storyId;


    const {
        data: story,
        error
    } =
        await supabaseClient
            .from("stories")
            .select("title")
            .eq(
                "id",
                storyId
            )
            .single();


    if (error) {

        alert(
            error.message
        );

        return;

    }


    document.getElementById(
        "chapterEditorTitle"
    ).innerText =
        "📖 " +
        story.title +
        " — Chapters";


    chapterEditor
        .classList
        .remove("hidden");


    await loadChapters();


    chapterEditor.scrollIntoView({
        behavior: "smooth"
    });

}


// =====================================================
// SAVE CHAPTER
// =====================================================

document
    .getElementById(
        "chapterForm"
    )
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            if (!selectedStoryId) {

                alert(
                    "Story එකක් තෝරන්න."
                );

                return;

            }


            const number =
                Number(
                    document
                        .getElementById(
                            "chapterNumber"
                        )
                        .value
                );


            const title =
                document
                    .getElementById(
                        "chapterTitle"
                    )
                    .value
                    .trim();


            const content =
                document
                    .getElementById(
                        "chapterContent"
                    )
                    .value
                    .trim();


            const {
                data: existing,
                error:
                    findError
            } =
                await supabaseClient
                    .from("chapters")
                    .select("id")
                    .eq(
                        "story_id",
                        selectedStoryId
                    )
                    .eq(
                        "number",
                        number
                    )
                    .maybeSingle();


            if (findError) {

                alert(
                    findError.message
                );

                return;

            }


            let error;


            if (existing) {

                const result =
                    await supabaseClient
                        .from("chapters")
                        .update({

                            title:
                                title,

                            content:
                                content

                        })
                        .eq(
                            "id",
                            existing.id
                        );


                error =
                    result.error;

            }

            else {

                const result =
                    await supabaseClient
                        .from("chapters")
                        .insert({

                            story_id:
                                selectedStoryId,

                            number:
                                number,

                            title:
                                title,

                            content:
                                content

                        });


                error =
                    result.error;

            }


            if (error) {

                alert(
                    error.message
                );

                return;

            }


            document.getElementById(
                "chapterForm"
            ).reset();


            await loadChapters();


            alert(
                "Chapter එක Save කළා! 📖"
            );

        }
    );


// =====================================================
// LOAD CHAPTERS
// =====================================================

async function loadChapters() {

    const list =
        document.getElementById(
            "chapterList"
        );


    const {
        data,
        error
    } =
        await supabaseClient
            .from("chapters")
            .select("*")
            .eq(
                "story_id",
                selectedStoryId
            )
            .order(
                "number",
                {
                    ascending:
                        true
                }
            );


    if (error) {

        list.innerHTML =
            "❌ " +
            escapeHTML(
                error.message
            );

        return;

    }


    list.innerHTML =
        "";


    if (
        !data ||
        data.length === 0
    ) {

        list.innerHTML = `

            <p style="color:#888;">

                තවම Chapters නැහැ.

            </p>

        `;

        return;

    }


    data.forEach(
        function(chapter) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "chapter-item";


            item.innerHTML = `

                <div>

                    <strong>
                        Chapter
                        ${escapeHTML(
                            chapter.number
                        )}
                    </strong>

                    —

                    ${escapeHTML(
                        chapter.title
                    )}

                </div>


                <button
                    class="admin-btn danger"
                    type="button"
                >

                    🗑️ Delete

                </button>

            `;


            item
                .querySelector(
                    "button"
                )
                .addEventListener(
                    "click",
                    function() {

                        deleteChapter(
                            chapter.id
                        );

                    }
                );


            list.appendChild(
                item
            );

        }
    );

}


// =====================================================
// DELETE CHAPTER
// =====================================================

async function deleteChapter(id) {

    if (
        !confirm(
            "මේ Chapter එක delete කරන්නද?"
        )
    ) {

        return;

    }


    const {
        error
    } =
        await supabaseClient
            .from("chapters")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            error.message
        );

        return;

    }


    await loadChapters();

}


// =====================================================
// CLOSE CHAPTER EDITOR

document
    .getElementById(
        "closeChapterEditor"
    )
    .addEventListener(
        "click",
        function() {

            chapterEditor
                .classList
                .add("hidden");


            selectedStoryId =
                null;

        }
    );

(async function() {

    const loggedIn =
        await checkAdminLogin();


    if (!loggedIn) {
        return;
    }


    await loadStories();

})();

</script>
