```html
<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Story | කතා අරණ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<header class="header">

    <div class="logo">

        📚

        <span>
            කතා අරණ
        </span>

    </div>


    <nav>

        <a href="index.html">
            🏠 මුල් පිටුව
        </a>

    </nav>

</header>



<main class="section">


    <div
        class="story-reader"
        id="storyInfo"
    >

        <p style="
            color:#888;
            text-align:center;
            padding:40px;
        ">

            ⏳ කතාව load වෙමින්...

        </p>

    </div>



    <section
        id="chapterListSection"
        style="margin-top:40px;"
    >

        <p class="label">
            CHAPTERS
        </p>


        <h2>
            📚 පරිච්ඡේද
        </h2>


        <div id="chapterList">

            <p style="color:#888;">
                ⏳ Chapters load වෙමින්...
            </p>

        </div>

    </section>



    <article
        class="reading-area"
        id="chapterArea"
        style="margin-top:40px;"
    >

        <p class="label">
            STORY
        </p>


        <h2>
            Chapter එකක් තෝරන්න
        </h2>


        <p>
            ඉහළින් Chapter එකක් තෝරලා
            කතාව කියවීම ආරම්භ කරන්න. 📖
        </p>

    </article>


</main>



<footer>

    <div class="footer-logo">
        📚 කතා අරණ
    </div>


    <p>
        සිංහල කතා කියවන්නට ඔබේම තැන.
    </p>


    <div class="footer-bottom">
        © 2026 KATHA ARANA.
        All Rights Reserved.
    </div>

</footer>



<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>


<script>


const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");


const storyInfo =
    document.getElementById(
        "storyInfo"
    );


const chapterList =
    document.getElementById(
        "chapterList"
    );


const chapterArea =
    document.getElementById(
        "chapterArea"
    );


let currentStory = null;

let currentChapters = [];

let readerFontSize = 19;



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value == null
            ? ""
            : String(value);

    return div.innerHTML;

}



// ==========================================
// LOAD STORY
// ==========================================

async function loadStory() {

    try {

        if (!storyId) {

            showStoryNotFound();

            return;

        }


        const {
            data: story,
            error: storyError
        } =
            await supabaseClient
                .from("stories")
                .select("*")
                .eq("id", storyId)
                .single();


        if (storyError || !story) {

            console.error(
                "Story load error:",
                storyError
            );

            showStoryNotFound();

            return;

        }


        const adult =
            String(
                story.category || ""
            )
            .trim()
            .toLowerCase()
            === "18+";


        if (adult) {

            const confirmed =
                confirm(
                    "🔞 18+ Content\n\n" +
                    "මෙම කතාව වැඩිහිටියන් සඳහා පමණි.\n\n" +
                    "ඔබට ඉදිරියට යාමට අවශ්‍යද?"
                );


            if (!confirmed) {

                window.location.href =
                    "index.html";

                return;

            }

        }


        currentStory = story;


        document.title =
            (
                story.title ||
                "Story"
            )
            +
            " | කතා අරණ";


        displayStory(story);


        await incrementViews(
            story.id
        );


        await loadChapters(
            story.id
        );

    }

    catch (error) {

        console.error(
            "Unexpected error:",
            error
        );

        showStoryNotFound();

    }

}



// ==========================================
// DISPLAY STORY
// ==========================================

function displayStory(story) {

    let coverHTML = "📖";


    if (
        story.cover &&
        String(story.cover).trim() !== ""
    ) {

        coverHTML = `

            <img
                src="${escapeHTML(story.cover)}"
                alt="${escapeHTML(
                    story.title || "Story"
                )}"
            >

        `;

    }


    const views =
        Number(story.views || 0);


    const rating =
        Number(story.rating || 0);


    storyInfo.innerHTML = `

        <div class="reader-cover cover">

            ${coverHTML}

        </div>


        <div class="reader-info">

            <p class="label">

                ${escapeHTML(
                    story.category || ""
                )}

            </p>


            <h1>

                ${escapeHTML(
                    story.title ||
                    "Untitled"
                )}

            </h1>


            <p class="author">

                ✍️

                ${escapeHTML(
                    story.author ||
                    "කතා අරණ"
                )}

            </p>


            <p class="description">

                ${escapeHTML(
                    story.description ||
                    ""
                )}

            </p>


            <div class="story-meta">

                <span id="storyViews">
                    👁️ ${views}
                </span>

                <span id="storyRating">
                    ⭐ ${formatRating(rating)}
                </span>

            </div>


            <div
                class="reader-controls"
                style="
                    display:flex;
                    gap:10px;
                    flex-wrap:wrap;
                    margin-top:20px;
                "
            >

                <button
                    onclick="toggleLike()"
                    id="likeButton"
                    type="button"
                >
                    🤍 Like
                </button>


                <button
                    onclick="toggleBookmark()"
                    id="bookmarkButton"
                    type="button"
                >
                    🔖 Bookmark
                </button>


                <button
                    onclick="changeFontSize(-1)"
                    type="button"
                >
                    A−
                </button>


                <button
                    onclick="changeFontSize(1)"
                    type="button"
                >
                    A+
                </button>


                <button
                    onclick="toggleReadingMode()"
                    type="button"
                >
                    🌙 Reading Mode
                </button>

            </div>


            <!-- RATING -->

            <div
                class="rating-box"
                style="
                    margin-top:25px;
                    padding:20px;
                    border-radius:12px;
                    background:#f7f7f7;
                "
            >

                <h3>
                    ⭐ මේ කතාවට Rating එකක් දෙන්න
                </h3>


                <div
                    id="ratingStars"
                    style="
                        display:flex;
                        gap:5px;
                        margin-top:12px;
                        flex-wrap:wrap;
                    "
                >

                    ${createRatingButtons()}

                </div>


                <p
                    id="myRatingText"
                    style="
                        margin-top:10px;
                        color:#777;
                    "
                ></p>

            </div>

        </div>

    `;


    updateReaderButtons();

    updateRatingUI();

}



// ==========================================
// RATING BUTTONS
// ==========================================

function createRatingButtons() {

    let html = "";


    for (let i = 1; i <= 5; i++) {

        html += `

            <button
                type="button"
                class="rating-star-button"
                data-rating="${i}"
                onclick="rateStory(${i})"
                style="
                    border:none;
                    background:transparent;
                    font-size:30px;
                    cursor:pointer;
                    padding:2px 5px;
                "
            >
                ☆
            </button>

        `;

    }


    return html;

}



// ==========================================
// RATE STORY
// ==========================================

async function rateStory(newRating) {

    if (!currentStory) {
        return;
    }


    newRating =
        Number(newRating);


    if (
        newRating < 1 ||
        newRating > 5
    ) {
        return;
    }


    const key =
        "rating_" +
        currentStory.id;


    const oldRating =
        Number(
            localStorage.getItem(key) || 0
        );


    if (oldRating === newRating) {

        return;

    }


    try {

        /*
         * Current rating stored in stories.rating.
         * If there is no previous rating,
         * simply save the selected rating.
         *
         * If the user already rated this story,
         * the new rating replaces their previous
         * local rating.
         */

        const {
            data,
            error
        } =
            await supabaseClient
                .from("stories")
                .update({
                    rating: newRating
                })
                .eq(
                    "id",
                    currentStory.id
                )
                .select("rating")
                .single();


        if (error) {

            console.error(
                "Rating update error:",
                error
            );


            alert(
                "Rating save කරන්න බැරි වුණා. 😔"
            );

            return;

        }


        localStorage.setItem(
            key,
            String(newRating)
        );


        currentStory.rating =
            Number(
                data.rating
            );


        updateRatingUI();


        const ratingElement =
            document.getElementById(
                "storyRating"
            );


        if (ratingElement) {

            ratingElement.innerText =
                "⭐ " +
                formatRating(
                    currentStory.rating
                );

        }


    }

    catch (error) {

        console.error(
            "Rating error:",
            error
        );

        alert(
            "Rating save කරන්න බැරි වුණා. 😔"
        );

    }

}



// ==========================================
// UPDATE RATING UI
// ==========================================

function updateRatingUI() {

    if (!currentStory) {
        return;
    }


    const myRating =
        Number(
            localStorage.getItem(
                "rating_" +
                currentStory.id
            ) || 0
        );


    const buttons =
        document.querySelectorAll(
            ".rating-star-button"
        );


    buttons.forEach(
        function(button) {

            const value =
                Number(
                    button.dataset.rating
                );


            button.innerText =
                value <= myRating
                    ? "⭐"
                    : "☆";

        }
    );


    const text =
        document.getElementById(
            "myRatingText"
        );


    if (text) {

        text.innerText =
            myRating > 0
                ? "ඔබ දුන් Rating එක: " +
                  myRating +
                  " / 5 ⭐"
                : "ඔබ තවම Rating එකක් දීලා නැහැ.";

    }

}



// ==========================================
// FORMAT RATING
// ==========================================

function formatRating(value) {

    const number =
        Number(value || 0);


    if (number <= 0) {

        return "0";

    }


    return number
        .toFixed(1)
        .replace(
            ".0",
            ""
        );

}



// ==========================================
// VIEWS
// ==========================================

async function incrementViews(id) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                "increment_story_views",
                {
                    p_story_id: id
                }
            );


        if (error) {

            console.error(
                "View count error:",
                error
            );

            return;

        }


        const viewsElement =
            document.getElementById(
                "storyViews"
            );


        if (viewsElement) {

            viewsElement.innerText =
                "👁️ " +
                data;

        }

    }

    catch (error) {

        console.error(
            "View error:",
            error
        );

    }

}



// ==========================================
// LOAD CHAPTERS
// ==========================================

async function loadChapters(id) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("chapters")
                .select("*")
                .eq(
                    "story_id",
                    id
                )
                .order(
                    "number",
                    {
                        ascending:true
                    }
                );


        if (error) {

            console.error(
                "Chapter load error:",
                error
            );


            chapterList.innerHTML = `

                <p style="color:#888;">
                    Chapters load කරන්න
                    බැරි වුණා. 😔
                </p>

            `;

            return;

        }


        currentChapters =
            data || [];


        displayChapters(
            currentChapters
        );

    }

    catch (error) {

        console.error(
            "Chapter error:",
            error
        );

    }

}



// ==========================================
// DISPLAY CHAPTERS
// ==========================================

function displayChapters(chapters) {

    chapterList.innerHTML = "";


    if (
        !chapters ||
        chapters.length === 0
    ) {

        chapterList.innerHTML = `

            <p style="color:#888;">
                තවම Chapter එකක්
                publish කරලා නැහැ. 📖
            </p>

        `;

        return;

    }


    chapters.forEach(
        function(chapter) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "chapter-button";


            button.innerHTML = `

                📖 Chapter
                ${escapeHTML(chapter.number)}
                —
                ${escapeHTML(
                    chapter.title ||
                    "Untitled"
                )}

            `;


            button.addEventListener(
                "click",
                function() {

                    openChapter(
                        chapter
                    );

                }
            );


            chapterList.appendChild(
                button
            );

        }
    );

}



// ==========================================
// OPEN CHAPTER
// ==========================================

function openChapter(chapter) {

    const currentIndex =
        currentChapters.findIndex(
            function(item) {

                return String(item.id)
                    ===
                    String(chapter.id);

            }
        );


    let buttonsHTML = "";


    if (currentIndex > 0) {

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="previousChapterButton"
            >
                ← Previous
            </button>

        `;

    }


    if (
        currentIndex !== -1 &&
        currentIndex <
        currentChapters.length - 1
    ) {

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="nextChapterButton"
            >
                Next →
            </button>

        `;

    }


    chapterArea.innerHTML = `

        <p class="label">

            CHAPTER
            ${escapeHTML(chapter.number)}

        </p>


        <h2>

            ${escapeHTML(
                chapter.title ||
                "Untitled"
            )}

        </h2>


        <div class="chapter-content">

            ${chapter.content || ""}

        </div>


        <div
            class="chapter-buttons"
            style="
                display:flex;
                gap:10px;
                margin-top:30px;
                flex-wrap:wrap;
            "
        >

            ${buttonsHTML}

        </div>

    `;


    const previousButton =
        document.getElementById(
            "previousChapterButton"
        );


    if (previousButton) {

        previousButton.addEventListener(
            "click",
            function() {

                openChapter(
                    currentChapters[
                        currentIndex - 1
                    ]
                );

            }
        );

    }


    const nextButton =
        document.getElementById(
            "nextChapterButton"
        );


    if (nextButton) {

        nextButton.addEventListener(
            "click",
            function() {

                openChapter(
                    currentChapters[
                        currentIndex + 1
                    ]
                );

            }
        );

    }


    applyFontSize();


    chapterArea.scrollIntoView({
        behavior:"smooth"
    });

}



// ==========================================
// LIKE
// ==========================================

async function toggleLike() {

    if (!currentStory) {
        return;
    }


    const key =
        "liked_" +
        currentStory.id;


    const liked =
        localStorage.getItem(key)
        ===
        "true";


    try {

        const {
            data,
            error
        } =
            await supabaseClient.rpc(
                liked
                    ? "decrement_story_likes"
                    : "increment_story_likes",
                {
                    p_story_id:
                        currentStory.id
                }
            );


        if (error) {

            console.error(
                "Like error:",
                error
            );

            return;

        }


        localStorage.setItem(
            key,
            String(!liked)
        );


        currentStory.liked =
            Number(data);


        updateReaderButtons();

    }

    catch (error) {

        console.error(
            "Like error:",
            error
        );

    }

}



// ==========================================
// BOOKMARK
// ==========================================

function toggleBookmark() {

    if (!currentStory) {
        return;
    }


    const key =
        "bookmark_" +
        currentStory.id;


    const bookmarked =
        localStorage.getItem(key)
        ===
        "true";


    localStorage.setItem(
        key,
        String(!bookmarked)
    );


    updateLibrary(
        currentStory.id,
        !bookmarked
    );


    updateReaderButtons();

}



// ==========================================
// LIBRARY
// ==========================================

function updateLibrary(id, add) {

    let library = [];


    try {

        library =
            JSON.parse(
                localStorage.getItem(
                    "kathaLibrary"
                )
            ) || [];

    }

    catch (error) {

        library = [];

    }


    library =
        library.filter(
            function(item) {

                return String(item)
                    !==
                    String(id);

            }
        );


    if (add) {

        library.push(id);

    }


    localStorage.setItem(
        "kathaLibrary",
        JSON.stringify(library)
    );

}



// ==========================================
// UPDATE BUTTONS
// ==========================================

function updateReaderButtons() {

    if (!currentStory) {
        return;
    }


    const likeButton =
        document.getElementById(
            "likeButton"
        );


    const bookmarkButton =
        document.getElementById(
            "bookmarkButton"
        );


    const liked =
        localStorage.getItem(
            "liked_" +
            currentStory.id
        )
        ===
        "true";


    const bookmarked =
        localStorage.getItem(
            "bookmark_" +
            currentStory.id
        )
        ===
        "true";


    const likeCount =
        Number(
            currentStory.liked || 0
        );


    if (likeButton) {

        likeButton.innerText =
            liked
                ? "❤️ Liked " + likeCount
                : "🤍 Like " + likeCount;

    }


    if (bookmarkButton) {

        bookmarkButton.innerText =
            bookmarked
                ? "🔖 Saved"
                : "🔖 Bookmark";

    }

}



// ==========================================
// FONT SIZE
// ==========================================

function changeFontSize(amount) {

    readerFontSize += amount;


    if (readerFontSize < 15) {

        readerFontSize = 15;

    }


    if (readerFontSize > 30) {

        readerFontSize = 30;

    }


    applyFontSize();

}



// ==========================================
// APPLY FONT SIZE
// ==========================================

function applyFontSize() {

    const content =
        document.querySelector(
            ".chapter-content"
        );


    if (content) {

        content.style.fontSize =
            readerFontSize + "px";


        content.style.lineHeight =
            "1.9";

    }

}



// ==========================================
// READING MODE
// ==========================================

function toggleReadingMode() {

    document.body
        .classList
        .toggle(
            "reading-mode"
        );

}



// ==========================================
// STORY NOT FOUND
// ==========================================

function showStoryNotFound() {

    storyInfo.innerHTML = `

        <div
            style="
                width:100%;
                text-align:center;
                padding:60px 20px;
            "
        >

            <h1>
                😕 Story එක හම්බ වුණේ නැහැ.
            </h1>


            <p
                style="
                    color:#888;
                    margin:20px 0;
                "
            >
                මේ story එක හොයාගන්න බැහැ.
            </p>


            <a
                href="index.html"
                class="read-btn"
            >
                ← Home Page
            </a>

        </div>

    `;


    chapterList.innerHTML = "";

    chapterArea.innerHTML = "";

}



// ==========================================
// START
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadStory();

    }
);

</script>


</body>

</html>
```
