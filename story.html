<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Story | කතා අරණ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <div class="logo">

        📚

        <span>
            කතා අරණ
        </span>

    </div>


    <nav>

        <a href="index.html">
            🏠 මුල් පිටුව
        </a>

    </nav>

</header>



<!-- =====================================
     MAIN
===================================== -->

<main class="section">


    <!-- STORY INFORMATION -->

    <div
        class="story-reader"
        id="storyInfo"
    >

        <p style="
            color:#888;
            text-align:center;
            padding:40px;
        ">

            ⏳ කතාව load වෙමින්...

        </p>

    </div>



    <!-- CHAPTERS -->

    <section
        id="chapterListSection"
        style="margin-top:40px;"
    >

        <p class="label">
            CHAPTERS
        </p>


        <h2>
            📚 පරිච්ඡේද
        </h2>


        <div id="chapterList">

            <p style="color:#888;">

                ⏳ Chapters load වෙමින්...

            </p>

        </div>

    </section>



    <!-- READING AREA -->

    <article
        class="reading-area"
        id="chapterArea"
        style="margin-top:40px;"
    >

        <p class="label">
            STORY
        </p>


        <h2>
            Chapter එකක් තෝරන්න
        </h2>


        <p>
            ඉහළින් Chapter එකක් තෝරලා
            කතාව කියවීම ආරම්භ කරන්න. 📖
        </p>

    </article>


</main>



<!-- =====================================
     FOOTER
===================================== -->

<footer>

    <div class="footer-logo">

        📚 කතා අරණ

    </div>


    <p>

        සිංහල කතා කියවන්නට ඔබේම තැන.

    </p>


    <div class="footer-bottom">

        © 2026 KATHA ARANA.
        All Rights Reserved.

    </div>

</footer>



<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


// ==========================================
// GET STORY ID
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");



// ==========================================
// ELEMENTS
// ==========================================

const storyInfo =
    document.getElementById(
        "storyInfo"
    );


const chapterList =
    document.getElementById(
        "chapterList"
    );


const chapterArea =
    document.getElementById(
        "chapterArea"
    );



// ==========================================
// CURRENT STORY
// ==========================================

let currentStory = null;



// ==========================================
// CURRENT CHAPTERS
// ==========================================

let currentChapters = [];



// ==========================================
// FONT SIZE
// ==========================================

let readerFontSize = 19;



// ==========================================
// LOAD STORY
// ==========================================

async function loadStory() {

    try {

        if (!storyId) {

            showStoryNotFound();

            return;

        }


        console.log(
            "Loading story:",
            storyId
        );



        // ==================================
        // GET STORY FROM SUPABASE
        // ==================================

        const {
            data: story,
            error: storyError
        } =
            await supabaseClient

                .from("stories")

                .select("*")

                .eq(
                    "id",
                    storyId
                )

                .single();



        if (storyError) {

            console.error(
                "Story load error:",
                storyError
            );

            showStoryNotFound();

            return;

        }



        if (!story) {

            showStoryNotFound();

            return;

        }



        // ==================================
        // 18+ STORY PROTECTION
        // ==================================

        const isAdultStory =
            String(
                story.category || ""
            )
            .trim()
            .toLowerCase()
            ===
            "18+";


        if (isAdultStory) {

            const confirmed =
                confirm(
                    "🔞 18+ Content\n\n" +
                    "මෙම කතාව වැඩිහිටියන් සඳහා පමණි.\n\n" +
                    "ඔබට ඉදිරියට යාමට අවශ්‍යද?"
                );


            if (!confirmed) {

                window.location.href =
                    "index.html";

                return;

            }

        }



        // ==================================
        // SAVE CURRENT STORY
        // ==================================

        currentStory =
            story;



        console.log(
            "Story loaded:",
            currentStory
        );



        // ==================================
        // PAGE TITLE
        // ==================================

        document.title =
            (
                story.title ||
                "Story"
            )
            +
            " | කතා අරණ";



        // ==================================
        // DISPLAY STORY
        // ==================================

        displayStory(
            story
        );



        // ==================================
        // INCREMENT VIEW
        // ==================================

        const {
            data: newViews,
            error: viewError
        } =
            await supabaseClient.rpc(
                "increment_story_views",
                {
                    p_story_id:
                        story.id
                }
            );



        if (viewError) {

            console.error(
                "View count error:",
                viewError
            );

        }

        else {

            console.log(
                "New views:",
                newViews
            );


            // Update displayed views

            const viewsElement =
                document.getElementById(
                    "storyViews"
                );


            if (viewsElement) {

                viewsElement.innerText =
                    "👁️ " +
                    newViews;

            }

        }



        // ==================================
        // LOAD CHAPTERS
        // ==================================

        await loadChapters(
            story.id
        );

    }

    catch (error) {

        console.error(
            "Unexpected error:",
            error
        );

        showStoryNotFound();

    }

}



// ==========================================
// DISPLAY STORY
// ==========================================

function displayStory(
    story
) {


    let coverHTML =
        "📖";



    if (
        story.cover &&
        String(
            story.cover
        ).trim() !== ""
    ) {

        coverHTML = `

            <img
                src="${escapeHTML(
                    story.cover
                )}"
                alt="${escapeHTML(
                    story.title ||
                    "Story"
                )}"
            >

        `;

    }



    const views =
        Number(
            story.views || 0
        );



    const rating =
        Number(
            story.rating || 0
        );



    storyInfo.innerHTML = `

        <div class="reader-cover cover">

            ${coverHTML}

        </div>


        <div class="reader-info">

            <p class="label">

                ${escapeHTML(
                    story.category ||
                    ""
                )}

            </p>


            <h1>

                ${escapeHTML(
                    story.title ||
                    "Untitled"
                )}

            </h1>


            <p class="author">

                ✍️

                ${escapeHTML(
                    story.author ||
                    "කතා අරණ"
                )}

            </p>


            <p class="description">

                ${escapeHTML(
                    story.description ||
                    ""
                )}

            </p>


            <div class="story-meta">


                <span id="storyViews">

                    👁️ ${views}

                </span>


                <span>

                    ⭐ ${rating}

                </span>


            </div>



            <div class="reader-controls">


                <button
                    onclick="toggleLike()"
                    id="likeButton"
                    type="button"
                >

                    🤍 Like

                </button>



                <button
                    onclick="toggleBookmark()"
                    id="bookmarkButton"
                    type="button"
                >

                    🔖 Bookmark

                </button>



                <button
                    onclick="changeFontSize(-1)"
                    type="button"
                >

                    A−

                </button>



                <button
                    onclick="changeFontSize(1)"
                    type="button"
                >

                    A+

                </button>



                <button
                    onclick="toggleReadingMode()"
                    type="button"
                >

                    🌙 Reading Mode

                </button>


            </div>

        </div>

    `;



    updateReaderButtons();

}



// ==========================================
// LOAD CHAPTERS
// ==========================================

async function loadChapters(
    storyId
) {

    try {

        console.log(
            "Loading chapters for story:",
            storyId
        );



        const {
            data,
            error
        } =
            await supabaseClient

                .from("chapters")

                .select("*")

                .eq(
                    "story_id",
                    storyId
                )

                .order(
                    "number",
                    {
                        ascending: true
                    }
                );



        if (error) {

            console.error(
                "Chapter load error:",
                error
            );


            chapterList.innerHTML = `

                <p style="
                    color:#888;
                    padding:15px 0;
                ">

                    Chapters load කරන්න
                    බැරි වුණා. 😔

                </p>

            `;

            return;

        }



        currentChapters =
            data || [];



        displayChapters(
            currentChapters
        );

    }

    catch (error) {

        console.error(
            "Chapter error:",
            error
        );


        chapterList.innerHTML = `

            <p style="
                color:#888;
                padding:15px 0;
            ">

                Chapters load කරන්න
                බැරි වුණා. 😔

            </p>

        `;

    }

}



// ==========================================
// DISPLAY CHAPTERS
// ==========================================

function displayChapters(
    chapters
) {

    chapterList.innerHTML =
        "";



    if (
        !chapters ||
        chapters.length === 0
    ) {

        chapterList.innerHTML = `

            <p style="
                color:#888;
                padding:15px 0;
            ">

                තවම Chapter එකක්
                publish කරලා නැහැ. 📖

            </p>

        `;

        return;

    }



    chapters.forEach(
        function(chapter) {


            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "chapter-button";


            button.innerHTML = `

                📖 Chapter

                ${escapeHTML(
                    chapter.number
                )}

                —

                ${escapeHTML(
                    chapter.title ||
                    "Untitled"
                )}

            `;



            button.addEventListener(
                "click",
                function() {

                    openChapter(
                        chapter
                    );

                }
            );



            chapterList.appendChild(
                button
            );

        }
    );

}



// ==========================================
// OPEN CHAPTER
// ==========================================

function openChapter(
    chapter
) {

    const currentIndex =
        currentChapters.findIndex(
            function(item) {

                return String(
                    item.id
                )
                ===
                String(
                    chapter.id
                );

            }
        );



    let buttonsHTML =
        "";



    // ==================================
    // PREVIOUS
    // ==================================

    if (
        currentIndex > 0
    ) {

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="previousChapterButton"
            >

                ← Previous

            </button>

        `;

    }



    // ==================================
    // NEXT
    // ==================================

    if (
        currentIndex !== -1
        &&
        currentIndex <
        currentChapters.length - 1
    ) {

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="nextChapterButton"
            >

                Next →

            </button>

        `;

    }



    chapterArea.innerHTML = `

        <p class="label">

            CHAPTER
            ${escapeHTML(
                chapter.number
            )}

        </p>


        <h2>

            ${escapeHTML(
                chapter.title ||
                "Untitled"
            )}

        </h2>


        <div class="chapter-content">

            ${chapter.content || ""}

        </div>


        <div
            class="chapter-buttons"
            style="
                display:flex;
                gap:10px;
                margin-top:30px;
                flex-wrap:wrap;
            "
        >

            ${buttonsHTML}

        </div>

    `;



    // ==================================
    // PREVIOUS BUTTON
    // ==================================

    const previousButton =
        document.getElementById(
            "previousChapterButton"
        );


    if (previousButton) {

        previousButton.addEventListener(
            "click",
            function() {

                openChapter(
                    currentChapters[
                        currentIndex - 1
                    ]
                );

            }
        );

    }



    // ==================================
    // NEXT BUTTON
    // ==================================

    const nextButton =
        document.getElementById(
            "nextChapterButton"
        );


    if (nextButton) {

        nextButton.addEventListener(
            "click",
            function() {

                openChapter(
                    currentChapters[
                        currentIndex + 1
                    ]
                );

            }
        );

    }



    applyFontSize();



    chapterArea.scrollIntoView({
        behavior: "smooth"
    });

}



// ==========================================
// LIKE
// ==========================================

function toggleLike() {

    if (!currentStory) {
        return;
    }



    const key =
        "liked_" +
        currentStory.id;



    const liked =
        localStorage.getItem(
            key
        )
        ===
        "true";



    localStorage.setItem(
        key,
        String(
            !liked
        )
    );



    updateReaderButtons();

}



// ==========================================
// BOOKMARK
// ==========================================

function toggleBookmark() {

    if (!currentStory) {
        return;
    }



    const key =
        "bookmark_" +
        currentStory.id;



    const bookmarked =
        localStorage.getItem(
            key
        )
        ===
        "true";



    localStorage.setItem(
        key,
        String(
            !bookmarked
        )
    );



    updateLibrary(
        currentStory.id,
        !bookmarked
    );



    updateReaderButtons();

}



// ==========================================
// UPDATE LIBRARY
// ==========================================

function updateLibrary(
    id,
    add
) {

    let library = [];



    try {

        library =
            JSON.parse(
                localStorage.getItem(
                    "kathaLibrary"
                )
            ) || [];

    }

    catch (error) {

        library = [];

    }



    library =
        library.filter(
            function(item) {

                return String(item)
                    !==
                    String(id);

            }
        );



    if (add) {

        library.push(
            id
        );

    }



    localStorage.setItem(
        "kathaLibrary",
        JSON.stringify(
            library
        )
    );

}



// ==========================================
// UPDATE BUTTONS
// ==========================================

function updateReaderButtons() {

    if (!currentStory) {
        return;
    }



    const likeButton =
        document.getElementById(
            "likeButton"
        );


    const bookmarkButton =
        document.getElementById(
            "bookmarkButton"
        );



    const liked =
        localStorage.getItem(
            "liked_" +
            currentStory.id
        )
        ===
        "true";



    const bookmarked =
        localStorage.getItem(
            "bookmark_" +
            currentStory.id
        )
        ===
        "true";



    if (likeButton) {

        likeButton.innerText =
            liked
                ? "❤️ Liked"
                : "🤍 Like";

    }



    if (bookmarkButton) {

        bookmarkButton.innerText =
            bookmarked
                ? "🔖 Saved"
                : "🔖 Bookmark";

    }

}



// ==========================================
// FONT SIZE
// ==========================================

function changeFontSize(
    amount
) {

    readerFontSize +=
        amount;



    if (
        readerFontSize < 15
    ) {

        readerFontSize =
            15;

    }



    if (
        readerFontSize > 30
    ) {

        readerFontSize =
            30;

    }



    applyFontSize();

}



// ==========================================
// APPLY FONT SIZE
// ==========================================

function applyFontSize() {

    const content =
        document.querySelector(
            ".chapter-content"
        );



    if (content) {

        content.style.fontSize =
            readerFontSize +
            "px";


        content.style.lineHeight =
            "1.9";

    }

}



// ==========================================
// READING MODE
// ==========================================

function toggleReadingMode() {

    document.body
        .classList
        .toggle(
            "reading-mode"
        );

}



// ==========================================
// STORY NOT FOUND
// ==========================================

function showStoryNotFound() {

    storyInfo.innerHTML = `

        <div
            style="
                width:100%;
                text-align:center;
                padding:60px 20px;
            "
        >

            <h1>

                😕 Story එක හම්බ වුණේ නැහැ.

            </h1>


            <p
                style="
                    color:#888;
                    margin:20px 0;
                "
            >

                මේ story එක හොයාගන්න බැහැ.

            </p>


            <a
                href="index.html"
                class="read-btn"
            >

                ← Home Page

            </a>

        </div>

    `;



    chapterList.innerHTML =
        "";


    chapterArea.innerHTML =
        "";

}



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}



// ==========================================
// START
// ==========================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadStory();

    }
);


</script>


</body>

</html>
```
