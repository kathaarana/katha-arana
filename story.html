<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Story | කතා අරණ</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   RATING
===================================================== */

.rating-box{
    margin-top:20px;
    padding:16px 18px;
    border-radius:14px;

    background:rgba(255,255,255,.035);

    border:1px solid rgba(255,255,255,.07);

    max-width:430px;
}

.rating-title{
    color:#aaa2b7;
    font-size:13px;
    margin-bottom:8px;
}

.rating-stars{
    display:flex;
    gap:4px;
}

.rating-star{
    border:none;
    background:transparent;

    color:#5f5868;

    font-size:28px;

    padding:2px;

    cursor:pointer;

    transition:.2s;
}

.rating-star:hover,
.rating-star.active{
    color:#ffd166;

    transform:scale(1.12);
}

.rating-result{
    margin-top:8px;

    color:#aaa2b7;

    font-size:13px;
}

.rating-message{
    margin-top:7px;

    font-size:13px;

    color:#a78bfa;
}


/* =====================================================
   PREMIUM STORY PAGE
===================================================== */

body{
    background:#08060d;
}

.story-page-header{
    width:100%;
    min-height:65px;

    padding:12px 5%;

    display:flex;
    align-items:center;
    justify-content:space-between;

    background:rgba(8,6,13,.88);

    border-bottom:1px solid rgba(192,132,252,.12);

    backdrop-filter:blur(18px);

    position:sticky;
    top:0;
    z-index:1000;
}

.story-page-logo{
    display:flex;
    align-items:center;
    gap:10px;

    font-size:20px;
    font-weight:700;
}

.story-page-header nav{
    display:flex;
    align-items:center;
}

.story-page-header nav a{
    text-decoration:none;

    color:#ddd5e8;

    padding:9px 15px;

    border-radius:10px;

    background:rgba(255,255,255,.05);

    transition:.25s;
}

.story-page-header nav a:hover{
    background:rgba(192,132,252,.14);
    color:#fff;
}


/* =====================================================
   STORY INFORMATION
===================================================== */

.story-reader{
    display:grid;

    grid-template-columns:240px 1fr;

    gap:40px;

    align-items:start;

    max-width:1100px;

    margin:auto;
}


/* COVER */

.reader-cover{
    width:240px;
    height:360px;

    border-radius:18px;

    overflow:hidden;

    background:
        linear-gradient(
            145deg,
            #241536,
            #0e0a15
        );

    border:1px solid
        rgba(192,132,252,.18);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.55),

        0 0 40px
        rgba(124,58,237,.08);
}

.reader-cover img{
    width:100%;
    height:100%;

    object-fit:cover;

    display:block;
}


/* STORY INFO */

.reader-info{
    padding-top:5px;
}

.reader-info h1{
    font-size:
        clamp(36px,5vw,58px);

    line-height:1.1;

    margin:8px 0 15px;

    color:#fff;

    letter-spacing:-1px;
}

.reader-info .author{
    color:#aaa2b7;

    font-size:15px;

    margin-bottom:18px;
}

.reader-info .description{
    max-width:800px;

    color:#aaa2b7;

    line-height:1.9;

    font-size:16px;
}


/* =====================================================
   STORY META
===================================================== */

.story-meta{
    display:flex;

    align-items:center;

    gap:10px;

    flex-wrap:wrap;

    margin-top:22px;
}

.story-meta span{
    display:inline-flex;

    align-items:center;

    gap:6px;

    padding:7px 11px;

    border-radius:9px;

    background:rgba(255,255,255,.045);

    border:1px solid rgba(255,255,255,.06);

    color:#aaa2b7;

    font-size:13px;
}

.story-meta .rating{
    color:#ffd166;
}


/* =====================================================
   CONTROLS
===================================================== */

.reader-controls{
    display:flex;

    flex-wrap:wrap;

    gap:10px;

    margin-top:18px;
}

.reader-controls button{
    border:1px solid
        rgba(255,255,255,.08);

    padding:11px 16px;

    border-radius:11px;

    cursor:pointer;

    background:
        rgba(255,255,255,.045);

    color:#e9e3ef;

    font-size:14px;

    transition:.25s;
}

.reader-controls button:hover{
    transform:translateY(-2px);

    background:
        rgba(192,132,252,.12);

    border-color:
        rgba(192,132,252,.35);
}

#likeButton.liked{
    color:#ff6b81;

    border-color:
        rgba(255,107,129,.3);

    background:
        rgba(255,107,129,.08);
}

#bookmarkButton.saved{
    color:#d8b4fe;

    border-color:
        rgba(192,132,252,.3);

    background:
        rgba(139,92,246,.10);
}


/* =====================================================
   CHAPTERS
===================================================== */

#chapterListSection{
    max-width:1100px;

    margin-left:auto;
    margin-right:auto;
}

#chapterList{
    display:grid;

    grid-template-columns:
        repeat(2,1fr);

    gap:12px;
}

.chapter-button{
    width:100%;

    text-align:left;

    padding:17px 20px;

    border:1px solid
        rgba(167,139,250,.12);

    border-radius:13px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.018)
        );

    color:#dcd5e5;

    cursor:pointer;

    transition:.25s;

    font-size:15px;
}

.chapter-button:hover{
    transform:translateX(5px);

    background:
        linear-gradient(
            135deg,
            rgba(139,92,246,.16),
            rgba(255,255,255,.035)
        );

    border-color:
        rgba(192,132,252,.4);

    color:#fff;
}


/* =====================================================
   READING AREA
===================================================== */

.reading-area{
    max-width:950px;

    margin-left:auto;
    margin-right:auto;

    padding:42px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            #15101f,
            #0d0a14
        );

    border:1px solid
        rgba(167,139,250,.14);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.4);
}

.reading-area h2{
    font-size:36px;

    color:#fff;

    line-height:1.3;

    margin-bottom:10px;
}

.chapter-content{
    font-size:19px;

    line-height:2;

    color:#d5cedd;

    margin-top:28px;

    overflow-wrap:anywhere;
}

.chapter-content p{
    margin-bottom:25px;
}

.chapter-content img{
    max-width:100%;

    border-radius:15px;

    margin:20px 0;
}

.chapter-buttons{
    display:flex;

    gap:10px;

    margin-top:35px;

    padding-top:25px;

    border-top:1px solid
        rgba(255,255,255,.06);

    flex-wrap:wrap;
}

.read-btn{
    display:inline-block;

    border:1px solid
        rgba(192,132,252,.18);

    padding:11px 18px;

    border-radius:10px;

    cursor:pointer;

    background:
        rgba(139,92,246,.08);

    color:#eee;

    text-decoration:none;

    transition:.25s;
}

.read-btn:hover{
    background:
        rgba(139,92,246,.2);

    border-color:
        rgba(192,132,252,.4);

    transform:translateY(-2px);
}


/* =====================================================
   FOOTER
===================================================== */

footer{
    background:
        linear-gradient(
            180deg,
            #0b0810,
            #050408
        );

    color:white;

    text-align:center;

    padding:55px 7% 25px;

    border-top:
        1px solid
        rgba(139,92,246,.12);
}

.footer-logo{
    font-size:24px;

    font-weight:bold;

    margin-bottom:10px;

    background:
        linear-gradient(
            90deg,
            #c084fc,
            #8b5cf6
        );

    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

footer p{
    color:#81798e;

    margin-bottom:35px;
}

.footer-bottom{
    border-top:
        1px solid
        rgba(255,255,255,.07);

    padding-top:20px;

    color:#625a6c;

    font-size:13px;
}


/* =====================================================
   READING MODE
===================================================== */

body.reading-mode{
    background:#050505;
}

body.reading-mode .story-page-header,
body.reading-mode footer,
body.reading-mode #storyInfo,
body.reading-mode #chapterListSection{
    display:none;
}

body.reading-mode .section{
    max-width:1000px;

    padding-top:35px;
}

body.reading-mode .reading-area{
    max-width:900px;

    padding:20px 0;

    background:transparent;

    border:none;

    box-shadow:none;
}

body.reading-mode .chapter-content{
    font-size:21px;

    line-height:2.05;

    color:#e4e4e4;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

    .story-page-header{
        padding:10px 14px;
    }

    .story-page-logo{
        font-size:17px;
    }

    .story-page-header nav a{
        font-size:13px;
        padding:8px 10px;
    }

    .story-reader{
        grid-template-columns:1fr;
        gap:28px;
    }

    .reader-cover{
        width:190px;
        height:285px;
        margin:auto;
    }

    .reader-info{
        text-align:center;
    }

    .reader-info h1{
        font-size:36px;
    }

    .reader-info .description{
        font-size:15px;
    }

    .story-meta{
        justify-content:center;
    }

    .reader-controls{
        justify-content:center;
    }

    .rating-box{
        margin-left:auto;
        margin-right:auto;
        text-align:left;
    }

    #chapterList{
        grid-template-columns:1fr;
    }

    .reading-area{
        padding:25px 18px;
    }

    .reading-area h2{
        font-size:28px;
    }

    .chapter-content{
        font-size:18px;
        line-height:1.9;
    }
}

@media(max-width:450px){

    .reader-cover{
        width:165px;
        height:248px;
    }

    .reader-info h1{
        font-size:31px;
    }

    .reader-controls button{
        padding:10px 12px;
        font-size:13px;
    }

}

</style>

</head>


<body>


<header class="story-page-header">

    <div class="story-page-logo">

<main class="section">

<div

>

<article

>

<script>

/* =====================================================
   STORY ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const storyId =
    params.get("id");


/* =====================================================
   ELEMENTS
===================================================== */

const storyInfo =
    document.getElementById("storyInfo");

const chapterList =
    document.getElementById("chapterList");

const chapterArea =
    document.getElementById("chapterArea");


/* =====================================================
   VARIABLES
===================================================== */

let currentStory = null;

let currentChapters = [];

let readerFontSize = 19;

let visitorId = null;


/* =====================================================
   VISITOR ID
===================================================== */

function getVisitorId(){

    let id =
        localStorage.getItem(
            "kathaVisitorId"
        );

    if(!id){

        id =
            "visitor_" +
            crypto.randomUUID();

        localStorage.setItem(
            "kathaVisitorId",
            id
        );

    }

    return id;

}

visitorId = getVisitorId();


/* =====================================================
   LOAD STORY
===================================================== */

async function loadStory(){

    try{

        if(!storyId){

            showStoryNotFound();

            return;

        }


        const {
            data:story,
            error:storyError
        } =
        await supabaseClient

        .from("stories")

        .select("*")

        .eq("id",storyId)

        .single();


        if(storyError){

            console.error(
                "Story load error:",
                storyError
            );

            showStoryNotFound();

            return;

        }


        if(!story){

            showStoryNotFound();

            return;

        }


        /* 18+ */

        const isAdultStory =
            String(
                story.category || ""
            )
            .trim()
            .toLowerCase()
            ===
            "18+";


        if(isAdultStory){

            const confirmed =
                confirm(
                    "🔞 18+ Content\n\n"+
                    "මෙම කතාව වැඩිහිටියන් සඳහා පමණි.\n\n"+
                    "ඔබට ඉදිරියට යාමට අවශ්‍යද?"
                );


            if(!confirmed){

                window.location.href =
                    "index.html";

                return;

            }

        }


        currentStory = story;


        document.title =
            (
                story.title ||
                "Story"
            )
            +
            " | කතා අරණ";


        displayStory(story);


        /* =================================================
           VIEW COUNT
        ================================================= */

        const {
            data:newViews,
            error:viewError
        } =
        await supabaseClient.rpc(
            "increment_story_views",
            {
                p_story_id:story.id
            }
        );


        if(!viewError){

            const viewsElement =
                document.getElementById(
                    "storyViews"
                );

            if(viewsElement){

                viewsElement.innerText =
                    "👁️ " +
                    newViews;

            }

        }


        /* LOAD RATING */

        await loadRating();


        /* LOAD CHAPTERS */

        await loadChapters(
            story.id
        );


    }

    catch(error){

        console.error(
            "Unexpected error:",
            error
        );

        showStoryNotFound();

    }

}


/* =====================================================
   DISPLAY STORY
===================================================== */

function displayStory(story){

    let coverHTML = "📖";


    if(
        story.cover &&
        String(story.cover).trim() !== ""
    ){

        coverHTML = `

            <img
                src="${escapeHTML(story.cover)}"
                alt="${escapeHTML(
                    story.title || "Story"
                )}"
            >

        `;

    }


    const views =
        Number(story.views || 0);


    const rating =
        Number(story.rating || 0);


    storyInfo.innerHTML = `

        <div class="reader-cover">

            ${coverHTML}

        </div>


        <div class="reader-info">

            <p class="label">

                ${escapeHTML(
                    story.category || ""
                )}

            </p>


            <h1>

                ${escapeHTML(
                    story.title ||
                    "Untitled"
                )}

            </h1>


            <p class="author">

                ✍️

                ${escapeHTML(
                    story.author ||
                    "කතා අරණ"
                )}

            </p>


            <p class="description">

                ${escapeHTML(
                    story.description || ""
                )}

            </p>


            <div class="story-meta">

                <span id="storyViews">

                    👁️ ${views}

                </span>


                <span
                    class="rating"
                    id="averageRating"
                >

                    ⭐ ${rating.toFixed(1)}

                </span>

            </div>


            <!-- RATING -->

            <div class="rating-box">

                <div class="rating-title">

                    ⭐ මේ කතාවට Rating එකක් දෙන්න

                </div>


                <div
                    class="rating-stars"
                    id="ratingStars"
                >

                    <button
                        class="rating-star"
                        data-rating="1"
                        type="button"
                    >
                        ☆
                    </button>

                    <button
                        class="rating-star"
                        data-rating="2"
                        type="button"
                    >
                        ☆
                    </button>

                    <button
                        class="rating-star"
                        data-rating="3"
                        type="button"
                    >
                        ☆
                    </button>

                    <button
                        class="rating-star"
                        data-rating="4"
                        type="button"
                    >
                        ☆
                    </button>

                    <button
                        class="rating-star"
                        data-rating="5"
                        type="button"
                    >
                        ☆
                    </button>

                </div>


                <div
                    class="rating-result"
                    id="ratingResult"
                >
                    Rating load වෙමින්...
                </div>


                <div
                    class="rating-message"
                    id="ratingMessage"
                ></div>

            </div>


            <div class="reader-controls">

                <button
                    onclick="toggleLike()"
                    id="likeButton"
                    type="button"
                >
                    🤍 Like
                </button>


                <button
                    onclick="toggleBookmark()"
                    id="bookmarkButton"
                    type="button"
                >
                    🔖 Bookmark
                </button>


                <button
                    onclick="changeFontSize(-1)"
                    type="button"
                >
                    A−
                </button>


                <button
                    onclick="changeFontSize(1)"
                    type="button"
                >
                    A+
                </button>


                <button
                    onclick="toggleReadingMode()"
                    type="button"
                >
                    🌙 Reading Mode
                </button>

            </div>

        </div>

    `;


    updateReaderButtons();

    setupRatingButtons();

}


/* =====================================================
   SETUP RATING BUTTONS
===================================================== */

function setupRatingButtons(){

    const stars =
        document.querySelectorAll(
            ".rating-star"
        );


    stars.forEach(
        function(star){

            star.addEventListener(
                "mouseenter",
                function(){

                    const value =
                        Number(
                            this.dataset.rating
                        );

                    highlightStars(value);

                }
            );


            star.addEventListener(
                "mouseleave",
                function(){

                    restoreMyRating();

                }
            );


            star.addEventListener(
                "click",
                async function(){

                    const value =
                        Number(
                            this.dataset.rating
                        );

                    await submitRating(value);

                }
            );

        }
    );

}


/* =====================================================
   HIGHLIGHT STARS
===================================================== */

function highlightStars(value){

    const stars =
        document.querySelectorAll(
            ".rating-star"
        );


    stars.forEach(
        function(star){

            const starValue =
                Number(
                    star.dataset.rating
                );


            if(starValue <= value){

                star.innerText = "★";

                star.classList.add(
                    "active"
                );

            }
            else{

                star.innerText = "☆";

                star.classList.remove(
                    "active"
                );

            }

        }
    );

}


/* =====================================================
   RESTORE USER RATING
===================================================== */

let myRating = 0;


function restoreMyRating(){

    highlightStars(
        Number(myRating || 0)
    );

}


/* =====================================================
   LOAD RATING
===================================================== */

async function loadRating(){

    if(!currentStory)
        return;


    try{

        /* AVERAGE */

        const {
            data:averageData,
            error:averageError
        } =
        await supabaseClient.rpc(
            "get_story_rating",
            {
                p_story_id:
                    Number(
                        currentStory.id
                    )
            }
        );


        if(averageError){

            console.error(
                "Get rating error:",
                averageError
            );

            return;

        }


        let average = 0;

        let count = 0;


        if(
            Array.isArray(
                averageData
            )
            &&
            averageData.length > 0
        ){

            average =
                Number(
                    averageData[0]
                    .average_rating
                    || 0
                );

            count =
                Number(
                    averageData[0]
                    .rating_count
                    || 0
                );

        }
        else if(
            averageData
        ){

            average =
                Number(
                    averageData.average_rating
                    || 0
                );

            count =
                Number(
                    averageData.rating_count
                    || 0
                );

        }


        const averageElement =
            document.getElementById(
                "averageRating"
            );


        if(averageElement){

            averageElement.innerText =
                "⭐ " +
                average.toFixed(1) +
                " (" +
                count +
                ")";

        }


        /* MY RATING */

        const {
            data:myData,
            error:myError
        } =
        await supabaseClient.rpc(
            "get_my_story_rating",
            {
                p_story_id:
                    Number(
                        currentStory.id
                    ),

                p_visitor_id:
                    visitorId
            }
        );


        if(!myError){

            if(
                Array.isArray(myData)
            ){

                if(myData.length > 0){

                    myRating =
                        Number(
                            myData[0]
                        );

                }

            }
            else if(
                myData !== null &&
                myData !== undefined
            ){

                myRating =
                    Number(myData);

            }

        }


        restoreMyRating();


        const result =
            document.getElementById(
                "ratingResult"
            );


        if(result){

            if(myRating > 0){

                result.innerText =
                    "ඔයාගේ Rating: " +
                    myRating +
                    " ⭐";

            }
            else{

                result.innerText =
                    "තවම Rating එකක් දාලා නැහැ";

            }

        }

    }

    catch(error){

        console.error(
            "Rating load error:",
            error
        );

    }

}


/* =====================================================
   SUBMIT RATING
===================================================== */

async function submitRating(value){

    if(!currentStory)
        return;


    if(value < 1 || value > 5)
        return;


    const message =
        document.getElementById(
            "ratingMessage"
        );


    if(message){

        message.innerText =
            "⏳ Rating save වෙමින්...";

    }


    try{

        const {
            data,
            error
        } =
        await supabaseClient.rpc(
            "set_story_rating",
            {
                p_story_id:
                    Number(
                        currentStory.id
                    ),

                p_visitor_id:
                    visitorId,

                p_rating:
                    value
            }
        );


        if(error){

            console.error(
                "Set rating error:",
                error
            );


            if(message){

                message.innerText =
                    "❌ Rating save කරන්න බැරි වුණා.";

            }

            return;

        }


        myRating = value;


        highlightStars(
            value
        );


        if(message){

            message.innerText =
                "✓ Rating එක save කළා! ⭐";

        }


        /* UPDATE RESULT */

        const result =
            document.getElementById(
                "ratingResult"
            );


        if(result){

            result.innerText =
                "ඔයාගේ Rating: " +
                value +
                " ⭐";

        }


        /* UPDATE AVERAGE */

        let average = 0;

        let count = 0;


        if(
            Array.isArray(data)
            &&
            data.length > 0
        ){

            average =
                Number(
                    data[0].average_rating
                    || 0
                );

            count =
                Number(
                    data[0].rating_count
                    || 0
                );

        }
        else if(data){

            average =
                Number(
                    data.average_rating
                    || 0
                );

            count =
                Number(
                    data.rating_count
                    || 0
                );

        }


        const averageElement =
            document.getElementById(
                "averageRating"
            );


        if(averageElement){

            averageElement.innerText =
                "⭐ " +
                average.toFixed(1) +
                " (" +
                count +
                ")";

        }

    }

    catch(error){

        console.error(
            "Rating error:",
            error
        );


        if(message){

            message.innerText =
                "❌ Rating save කරන්න බැරි වුණා.";

        }

    }

}


/* =====================================================
   LIKE
===================================================== */

async function toggleLike(){

    if(!currentStory)
        return;


    const key =
        "liked_" +
        currentStory.id;


    const liked =
        localStorage.getItem(key)
        ===
        "true";


    try{

        if(!liked){

            const {
                error
            } =
            await supabaseClient.rpc(
                "increment_story_likes",
                {
                    p_story_id:
                        Number(
                            currentStory.id
                        )
                }
            );


            if(error){

                console.error(
                    "Like error:",
                    error
                );

                return;

            }

        }
        else{

            const {
                error
            } =
            await supabaseClient.rpc(
                "decrement_story_likes",
                {
                    p_story_id:
                        Number(
                            currentStory.id
                        )
                }
            );


            if(error){

                console.error(
                    "Unlike error:",
                    error
                );

                return;

            }

        }


        localStorage.setItem(
            key,
            String(!liked)
        );


        updateReaderButtons();

    }

    catch(error){

        console.error(
            "Like error:",
            error
        );

    }

}


/* =====================================================
   BOOKMARK
===================================================== */

function toggleBookmark(){

    if(!currentStory)
        return;


    const key =
        "bookmark_" +
        currentStory.id;


    const bookmarked =
        localStorage.getItem(key)
        ===
        "true";


    localStorage.setItem(
        key,
        String(!bookmarked)
    );


    updateLibrary(
        currentStory.id,
        !bookmarked
    );


    updateReaderButtons();

}


/* =====================================================
   LIBRARY
===================================================== */

function updateLibrary(id,add){

    let library = [];


    try{

        library =
            JSON.parse(
                localStorage.getItem(
                    "kathaLibrary"
                )
            )
            || [];

    }

    catch(error){

        library = [];

    }


    library =
        library.filter(
            function(item){

                return String(item)
                !==
                String(id);

            }
        );


    if(add){

        library.push(id);

    }


    localStorage.setItem(
        "kathaLibrary",
        JSON.stringify(library)
    );

}


/* =====================================================
   UPDATE BUTTONS
===================================================== */

function updateReaderButtons(){

    if(!currentStory)
        return;


    const likeButton =
        document.getElementById(
            "likeButton"
        );


    const bookmarkButton =
        document.getElementById(
            "bookmarkButton"
        );


    const liked =
        localStorage.getItem(
            "liked_" +
            currentStory.id
        )
        ===
        "true";


    const bookmarked =
        localStorage.getItem(
            "bookmark_" +
            currentStory.id
        )
        ===

    if(likeButton){

        likeButton.innerText =
            liked
            ? "❤️ Liked"
            : "🤍 Like";


        likeButton.classList.toggle(
            "liked",

        );

    }


    if(bookmarkButton){

            bookmarked
            ? "🔖 Saved"
            : "🔖 Bookmark";


        bookmarkButton.classList.toggle(
            "saved",
            bookmarked
        );

    }

}

async function loadChapters(storyId){

    try{

        const {
            data,
            error
        } =
        await supabaseClient

        .from("chapters")

        .select("*")

        .eq(
            "story_id",
            storyId
        )

        .order(
            "number",
            {
                ascending:true
            }
        );


        if(error){

            console.error(
                "Chapter load error:",
                error
            );


            chapterList.innerHTML = `

                <p style="color:#888;">

                    Chapters load කරන්න
                    බැරි වුණා. 😔

                </p>

            `;

            return;

        }


        currentChapters =
            data || [];


        displayChapters(
            currentChapters
        );

    }

    catch(error){

        console.error(error);

    }

}


/* =====================================================
   DISPLAY CHAPTERS
===================================================== */

function displayChapters(chapters){

    chapterList.innerHTML = "";


    if(
        !chapters ||
        chapters.length === 0
    ){

        chapterList.innerHTML = `

            <p style="color:#888;">

                තවම Chapter එකක්
                publish කරලා නැහැ. 📖

            </p>

        `;

        return;

    }


    chapters.forEach(
        function(chapter){

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";

            button.className =
                "chapter-button";


            button.innerHTML = `

                📖 Chapter

                ${escapeHTML(
                    chapter.number
                )}

                —

                ${escapeHTML(
                    chapter.title ||
                    "Untitled"
                )}

            `;


            button.addEventListener(
                "click",
                function(){

                    openChapter(
                        chapter
                    );

                }
            );


            chapterList.appendChild(
                button
            );

        }
    );

}


/* =====================================================
   OPEN CHAPTER
===================================================== */

function openChapter(chapter){

    const currentIndex =
        currentChapters.findIndex(
            function(item){

                return String(item.id)
                ===
                String(chapter.id);

            }
        );


    let buttonsHTML = "";


    if(currentIndex > 0){

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="previousChapterButton"
            >
                ← Previous
            </button>

        `;

    }


    if(
        currentIndex !== -1 &&
        currentIndex <
        currentChapters.length - 1
    ){

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="nextChapterButton"
            >
                Next →
            </button>

        `;

    }


    chapterArea.innerHTML = `

        <p class="label">

            CHAPTER
            ${escapeHTML(
                chapter.number
            )}

        </p>


        <h2>

            ${escapeHTML(
                chapter.title ||
                "Untitled"
            )}

        </h2>


        <div class="chapter-content">

            ${chapter.content || ""}

        </div>


        <div class="chapter-buttons">

            ${buttonsHTML}

        </div>

    `;


    const previousButton =
        document.getElementById(
            "previousChapterButton"
        );


    if(previousButton){

        previousButton.addEventListener(
            "click",
            function(){

                openChapter(
                    currentChapters[
                        currentIndex - 1
                    ]
                );

            }
        );

    }


    const nextButton =
        document.getElementById(
            "nextChapterButton"
        );


    if(nextButton){

        nextButton.addEventListener(
            "click",
            function(){

                openChapter(
                    currentChapters[
                        currentIndex + 1
                    ]
                );

            }
        );

    }


    applyFontSize();


    chapterArea.scrollIntoView({
        behavior:"smooth"
    });

}

function escapeHTML(value){

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
        ? ""
        : String(value);


    return div.innerHTML;

}
