<!DOCTYPE html>
<html lang="si">

<head>

<meta charset="UTF-8">

<title>Story | කතා අරණ</title>

<link rel="stylesheet" href="style.css">

<style>

/* =====================================================
   RATING
===================================================== */

.rating-box{
    margin-top:20px;
}

.rating-title{
    color:#aaa2b7;
    font-size:14px;
    margin-bottom:9px;
}

</article>

<!-- =====================================================
     FOOTER

<footer>

        සිංහල කතා කියවන්නට ඔබේම තැන.

</footer>



<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>

/* =====================================================
   STORY ID
===================================================== */

const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");



/* =====================================================
   ELEMENTS
===================================================== */

const storyInfo =
    document.getElementById("storyInfo");


const chapterList =
    document.getElementById("chapterList");


const chapterArea =
    document.getElementById("chapterArea");



/* =====================================================
   VARIABLES
===================================================== */

let currentStory = null;

let currentChapters = [];

let readerFontSize = 19;



/* =====================================================
   LOAD STORY
===================================================== */

async function loadStory(){

    try{

        if(!storyId){

            showStoryNotFound();

            return;

        }


        const {
            data:story,
            error:storyError
        } =
        await supabaseClient

        .from("stories")

        .select("*")

        .eq("id",storyId)

        .single();


        if(storyError){

            console.error(
                "Story load error:",
                storyError
            );

            showStoryNotFound();

            return;

        }


        if(!story){

            showStoryNotFound();

            return;

        }


        /* 18+ */

        const isAdultStory =
            String(
                story.category || ""
            )
            .trim()
            .toLowerCase()
            ===
            "18+";


        if(isAdultStory){

            const confirmed =
                confirm(
                    "🔞 18+ Content\n\n"+
                    "මෙම කතාව වැඩිහිටියන් සඳහා පමණි.\n\n"+
                    "ඔබට ඉදිරියට යාමට අවශ්‍යද?"
                );


            if(!confirmed){

                window.location.href =
                    "index.html";

                return;

            }

        }


        currentStory = story;


        document.title =
            (
                story.title ||
                "Story"
            )
            +
            " | කතා අරණ";


        displayStory(story);



        /* =================================================
           VIEW COUNT
        ================================================= */

        const {
            data:newViews,
            error:viewError
        } =
        await supabaseClient.rpc(

            "increment_story_views",

            {
                p_story_id:
                    story.id
            }

        );


        if(!viewError){

            const viewsElement =
                document.getElementById(
                    "storyViews"
                );


            if(viewsElement){

                viewsElement.innerText =
                    "👁️ " +
                    newViews;

            }

        }


        await loadLikeCount(story.id);

        await loadRating(story.id);

        await loadChapters(story.id);

    }

    catch(error){

        console.error(
            "Unexpected error:",
            error
        );

        showStoryNotFound();

    }

}



/* =====================================================
   DISPLAY STORY
===================================================== */

function displayStory(story){

    let coverHTML = "📖";


    if(
        story.cover &&
        String(story.cover).trim() !== ""
    ){

        coverHTML = `

            <img
                src="${escapeHTML(story.cover)}"
                alt="${escapeHTML(
                    story.title || "Story"
                )}"
            >

        `;

    }


    const views =
        Number(story.views || 0);


    storyInfo.innerHTML = `

        <div class="reader-cover">

            ${coverHTML}

        </div>


        <div class="reader-info">

            <p class="label">

                ${escapeHTML(
                    story.category || ""
                )}

            </p>


            <h1>

                ${escapeHTML(
                    story.title ||
                    "Untitled"
                )}

            </h1>


            <p class="author">

                ✍️

                ${escapeHTML(
                    story.author ||
                    "කතා අරණ"
                )}

            </p>


            <p class="description">

                ${escapeHTML(
                    story.description || ""
                )}

            </p>


            <!-- STORY META -->

            <div class="story-meta">

                <span id="storyViews">

                    👁️ ${views}

                </span>


                <span id="storyLikeCount">

                    ❤️ 0

                </span>


                <span
                    class="rating"
                    id="storyRating"
                >

                    ⭐ 0.0

                </span>

            </div>



            <!-- CONTROLS -->

            <div class="reader-controls">


                <button
                    onclick="toggleLike()"
                    id="likeButton"
                    type="button"
                >

                    🤍 Like

                </button>


                <button
                    onclick="toggleBookmark()"
                    id="bookmarkButton"
                    type="button"
                >

                    🔖 Bookmark

                </button>


                <button
                    onclick="changeFontSize(-1)"
                    type="button"
                >

                    A−

                </button>


                <button
                    onclick="changeFontSize(1)"
                    type="button"
                >

                    A+

                </button>


                <button
                    onclick="toggleReadingMode()"
                    type="button"
                >

                    🌙 Reading Mode

                </button>


            </div>



            <!-- RATING -->

            <div class="rating-box">

                <div class="rating-title">

                    ⭐ මේ කතාවට Rating එකක් දෙන්න

                </div>


                <div
                    class="rating-stars"
                    id="ratingStars"
                >

                    <button
                        class="rating-star"
                        data-rating="1"
                        type="button"
                    >
                        ★
                    </button>


                    <button
                        class="rating-star"
                        data-rating="2"
                        type="button"
                    >
                        ★
                    </button>


                    <button
                        class="rating-star"
                        data-rating="3"
                        type="button"
                    >
                        ★
                    </button>


                    <button
                        class="rating-star"
                        data-rating="4"
                        type="button"
                    >
                        ★
                    </button>


                    <button
                        class="rating-star"
                        data-rating="5"
                        type="button"
                    >
                        ★
                    </button>

                </div>


                <div
                    class="rating-message"
                    id="ratingMessage"
                >

                    Rating එකක් තෝරන්න

                </div>

            </div>

        </div>

    `;


    updateReaderButtons();

    setupRatingButtons();

}



/* =====================================================
   LIKE COUNT
===================================================== */

async function loadLikeCount(id){

    try{

        const {
            data,
            error
        } =
        await supabaseClient

        .from("stories")

        .select("likes")

        .eq("id",id)

        .single();


        if(error){

            console.error(
                "Like count error:",
                error
            );

            return;

        }


        const count =
            Number(data?.likes || 0);


        const element =
            document.getElementById(
                "storyLikeCount"
            );


        if(element){

            element.innerText =
                "❤️ " + count;

        }

    }

    catch(error){

        console.error(error);

    }

}



/* =====================================================
   LIKE
===================================================== */

async function toggleLike(){

    if(!currentStory)
        return;


    const key =
        "liked_" +
        currentStory.id;


    const liked =
        localStorage.getItem(key)
        ===
        "true";


    try{

        let result;


        if(liked){

            /* UNLIKE */

            result =
                await supabaseClient.rpc(
                    "decrement_story_likes",
                    {
                        p_story_id:
                            Number(
                                currentStory.id
                            )
                    }
                );

        }

        else{

            /* LIKE */

            result =
                await supabaseClient.rpc(
                    "increment_story_likes",
                    {
                        p_story_id:
                            Number(
                                currentStory.id
                            )
                    }
                );

        }


        if(result.error){

            console.error(
                "Like error:",
                result.error
            );

            alert(
                "Like update කරන්න බැරි උනා.\n\n"+
                "Supabase SQL function / permission එක check කරන්න."
            );

            return;

        }


        const newCount =
            Number(
                result.data ?? 0
            );


        localStorage.setItem(
            key,
            String(!liked)
        );


        const likeCount =
            document.getElementById(
                "storyLikeCount"
            );


        if(likeCount){

            likeCount.innerText =
                "❤️ " +
                newCount;

        }


        updateReaderButtons();

    }

    catch(error){

        console.error(
            "Like unexpected error:",
            error
        );

    }

}



/* =====================================================
   RATING BUTTON SETUP
===================================================== */

function setupRatingButtons(){

    const buttons =
        document.querySelectorAll(
            ".rating-star"
        );


    buttons.forEach(
        function(button){

            button.addEventListener(
                "click",
                function(){

                    const rating =
                        Number(
                            button.dataset.rating
                        );

                    submitRating(rating);

                }
            );

        }
    );


    loadUserRating();

}



/* =====================================================
   SUBMIT RATING
===================================================== */

async function submitRating(rating){

    if(!currentStory)
        return;


    if(
        rating < 1 ||
        rating > 5
    )
        return;


    const ratingKey =
        "rating_" +
        currentStory.id;


    try{

        const oldRating =
            Number(
                localStorage.getItem(
                    ratingKey
                ) || 0
            );


        let result;


        /*
           User has already rated.
           Update existing rating.
        */

        if(oldRating >= 1){

            result =
                await supabaseClient.rpc(
                    "update_story_rating",
                    {
                        p_story_id:
                            Number(
                                currentStory.id
                            ),

                        p_old_rating:
                            oldRating,

                        p_new_rating:
                            rating
                    }
                );

        }

        else{

            /*
               First rating
            */

            result =
                await supabaseClient.rpc(
                    "add_story_rating",
                    {
                        p_story_id:
                            Number(
                                currentStory.id
                            ),

                        p_rating:
                            rating
                    }
                );

        }


        if(result.error){

            console.error(
                "Rating error:",
                result.error
            );

            alert(
                "Rating save කරන්න බැරි උනා.\n\n"+
                "Supabase Rating SQL function / permission check කරන්න."
            );

            return;

        }


        localStorage.setItem(
            ratingKey,
            String(rating)
        );


        updateRatingStars(rating);


        const message =
            document.getElementById(
                "ratingMessage"
            );


        if(message){

            message.innerText =
                "⭐ ඔයා දුන්න Rating එක: " +
                rating +
                "/5";

        }


        await loadRating(
            currentStory.id
        );

    }

    catch(error){

        console.error(
            "Rating unexpected error:",
            error
        );

    }

}



/* =====================================================
   LOAD USER RATING
===================================================== */

function loadUserRating(){

    if(!currentStory)
        return;


    const rating =
        Number(
            localStorage.getItem(
                "rating_" +
                currentStory.id
            ) || 0
        );


    if(rating > 0){

        updateRatingStars(rating);


        const message =
            document.getElementById(
                "ratingMessage"
            );


        if(message){

            message.innerText =
                "⭐ ඔයා දුන්න Rating එක: " +
                rating +
                "/5";

        }

    }

}



/* =====================================================
   UPDATE STAR UI
===================================================== */

function updateRatingStars(rating){

    const buttons =
        document.querySelectorAll(
            ".rating-star"
        );


    buttons.forEach(
        function(button){

            const value =
                Number(
                    button.dataset.rating
                );


            button.classList.toggle(
                "active",
                value <= rating
            );

        }
    );

}



/* =====================================================
   LOAD AVERAGE RATING
===================================================== */

async function loadRating(id){

    try{

        const {
            data,
            error
        } =
        await supabaseClient

        .from("stories")

        .select(
            "rating,rating_count"
        )

        .eq("id",id)

        .single();


        if(error){

            console.error(
                "Rating load error:",
                error
            );

            return;

        }


        const rating =
            Number(
                data?.rating || 0
            );


        const count =
            Number(
                data?.rating_count || 0
            );


        const element =
            document.getElementById(
                "storyRating"
            );


        if(element){

            element.innerText =
                "⭐ " +
                rating.toFixed(1) +
                " (" +
                count +
                ")";

        }

    }

    catch(error){

        console.error(error);

    }

}



/* =====================================================
   BOOKMARK
===================================================== */

function toggleBookmark(){

    if(!currentStory)
        return;


    const key =
        "bookmark_" +
        currentStory.id;


    const bookmarked =
        localStorage.getItem(key)
        ===
        "true";


    localStorage.setItem(
        key,
        String(!bookmarked)
    );


    updateLibrary(
        currentStory.id,
        !bookmarked
    );


    updateReaderButtons();

}



/* =====================================================
   LIBRARY
===================================================== */

function updateLibrary(id,add){

    let library = [];


    try{

        library =
            JSON.parse(
                localStorage.getItem(
                    "kathaLibrary"
                )
            )
            || [];

    }

    catch(error){

        library = [];

    }


    library =
        library.filter(
            function(item){

                return String(item)
                !==
                String(id);

            }
        );


    if(add){

        library.push(id);

    }


    localStorage.setItem(
        "kathaLibrary",
        JSON.stringify(library)
    );

}



/* =====================================================
   UPDATE BUTTONS
===================================================== */

function updateReaderButtons(){

    if(!currentStory)
        return;


    const likeButton =
        document.getElementById(
            "likeButton"
        );


    const bookmarkButton =
        document.getElementById(
            "bookmarkButton"
        );


    const liked =
        localStorage.getItem(
            "liked_" +
            currentStory.id
        )
        ===
        "true";


    const bookmarked =
        localStorage.getItem(
            "bookmark_" +
            currentStory.id
        )
        ===
        "true";


    if(likeButton){

        likeButton.innerText =
            liked
            ? "❤️ Liked"
            : "🤍 Like";


        likeButton.classList.toggle(
            "liked",
            liked
        );

    }


    if(bookmarkButton){

        bookmarkButton.innerText =
            bookmarked
            ? "🔖 Saved"
            : "🔖 Bookmark";


        bookmarkButton.classList.toggle(
            "saved",
            bookmarked
        );

    }

}



/* =====================================================
   FONT SIZE
===================================================== */

function changeFontSize(amount){

    readerFontSize += amount;


    if(readerFontSize < 15)
        readerFontSize = 15;


    if(readerFontSize > 30)
        readerFontSize = 30;


    applyFontSize();

}



function applyFontSize(){

    const content =
        document.querySelector(
            ".chapter-content"
        );


    if(content){

        content.style.fontSize =
            readerFontSize + "px";


        content.style.lineHeight =
            "1.9";

    }

}



/* =====================================================
   READING MODE
===================================================== */

function toggleReadingMode(){

    document.body
        .classList
        .toggle("reading-mode");

}



/* =====================================================
   OPEN CHAPTER
===================================================== */

async function loadChapters(storyId){

    try{

        const {
            data,
            error
        } =
        await supabaseClient

        .from("chapters")

        .select("*")

        .eq("story_id",storyId)

        .order(
            "number",
            {
                ascending:true
            }
        );


        if(error){

            console.error(
                "Chapter load error:",
                error
            );

            chapterList.innerHTML = `

                <p style="color:#888;">
                    Chapters load කරන්න
                    බැරි වුණා. 😔
                </p>

            `;

            return;

        }


        currentChapters =
            data || [];


        displayChapters(
            currentChapters
        );

    }

    catch(error){

        console.error(error);

    }

}



function displayChapters(chapters){

    chapterList.innerHTML = "";


    if(
        !chapters ||
        chapters.length === 0
    ){

        chapterList.innerHTML = `

            <p style="color:#888;">
                තවම Chapter එකක්
                publish කරලා නැහැ. 📖
            </p>

        `;

        return;

    }


    chapters.forEach(
        function(chapter){

            const button =
                document.createElement(
                    "button"
                );


            button.type = "button";


            button.className =
                "chapter-button";


            button.innerHTML = `

                📖 Chapter

                ${escapeHTML(
                    chapter.number
                )}

                —

                ${escapeHTML(
                    chapter.title ||
                    "Untitled"
                )}

            `;


            button.addEventListener(
                "click",
                function(){

                    openChapter(
                        chapter
                    );

                }
            );


            chapterList.appendChild(
                button
            );

        }
    );

}



function openChapter(chapter){

    const currentIndex =
        currentChapters.findIndex(
            function(item){

                return String(item.id)
                ===
                String(chapter.id);

            }
        );


    let buttonsHTML = "";


    if(currentIndex > 0){

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="previousChapterButton"
            >

                ← Previous

            </button>

        `;

    }


    if(
        currentIndex !== -1 &&
        currentIndex <
        currentChapters.length - 1
    ){

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="nextChapterButton"
            >

                Next →

            </button>

        `;

    }


    chapterArea.innerHTML = `

        <p class="label">

            CHAPTER
            ${escapeHTML(
                chapter.number
            )}

        </p>


        <h2>

            ${escapeHTML(
                chapter.title ||
                "Untitled"
            )}

        </h2>


        <div class="chapter-content">

            ${chapter.content || ""}

        </div>


        <div class="chapter-buttons">

            ${buttonsHTML}

        </div>

    `;


    const previousButton =
        document.getElementById(
            "previousChapterButton"
        );


    if(previousButton){

        previousButton.addEventListener(
            "click",
            function(){

                openChapter(
                    currentChapters[
                        currentIndex - 1
                    ]
                );

            }
        );

    }


    const nextButton =
        document.getElementById(
            "nextChapterButton"
        );


    if(nextButton){

        nextButton.addEventListener(
            "click",
            function(){

                openChapter(
                    currentChapters[
                        currentIndex + 1
                    ]
                );

            }
        );

    }


    applyFontSize();


    chapterArea.scrollIntoView({
        behavior:"smooth"
    });

}

function escapeHTML(value){

    const div =
        document.createElement("div");


    div.textContent =

        ? ""

    return div.innerHTML;
