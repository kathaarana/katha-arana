```html
<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Story | කතා අරණ</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================
     HEADER
===================================== -->

<header class="header">

    <div class="logo">

        📚

        <span>
            කතා අරණ
        </span>

    </div>


    <nav>

        <a href="index.html">
            🏠 මුල් පිටුව
        </a>

    </nav>

</header>



<!-- =====================================
     STORY
===================================== -->

<main class="section">


    <!-- STORY INFORMATION -->

    <div
        class="story-reader"
        id="storyInfo"
    >

        <p style="
            color:#888;
            padding:30px 0;
        ">

            📚 Story එක load වෙමින් පවතී...

        </p>

    </div>



    <!-- CHAPTERS -->

    <section
        id="chapterListSection"
        style="margin-top:40px;"
    >

        <p class="label">
            CHAPTERS
        </p>


        <h2>
            📚 පරිච්ඡේද
        </h2>


        <div id="chapterList">

            <p style="
                color:#888;
                padding:15px 0;
            ">

                Chapters load වෙමින් පවතී...

            </p>

        </div>

    </section>



    <!-- READING AREA -->

    <article
        class="reading-area"
        id="chapterArea"
        style="margin-top:40px;"
    >

        <p class="label">
            STORY
        </p>


        <h2>
            Chapter එකක් තෝරන්න
        </h2>


        <p>
            ඉහළින් Chapter එකක් තෝරලා
            කතාව කියවීම ආරම්භ කරන්න. 📖
        </p>

    </article>


</main>



<!-- =====================================
     FOOTER
===================================== -->

<footer>

    <div class="footer-logo">
        📚 කතා අරණ
    </div>


    <p>
        සිංහල කතා කියවන්නට ඔබේම තැන.
    </p>


    <div class="footer-bottom">

        © 2026 KATHA ARANA.
        All Rights Reserved.

    </div>

</footer>



<!-- =====================================
     SUPABASE
===================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase.js"></script>



<script>


// ==========================================
// STORY ID
// ==========================================

const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");



// ==========================================
// ELEMENTS
// ==========================================

const storyInfo =
    document.getElementById(
        "storyInfo"
    );


const chapterList =
    document.getElementById(
        "chapterList"
    );


const chapterArea =
    document.getElementById(
        "chapterArea"
    );



// ==========================================
// FONT SIZE
// ==========================================

let readerFontSize = 19;



// ==========================================
// CURRENT CHAPTERS
// ==========================================

let currentChapters = [];



// ==========================================
// ESCAPE HTML
// ==========================================

function escapeHTML(value) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}



// ==========================================
// LOAD STORY
// ==========================================

async function loadStory() {

    if (!storyId) {

        showStoryNotFound();

        return;

    }


    try {

        // ==================================
        // GET STORY
        // ==================================

        const {
            data: story,
            error: storyError
        } = await supabaseClient

            .from("stories")

            .select("*")

            .eq("id", storyId)

            .single();


        if (storyError) {

            console.error(
                "Story error:",
                storyError
            );

            showStoryError(
                storyError.message
            );

            return;

        }


        if (!story) {

            showStoryNotFound();

            return;

        }


        // ==================================
        // PAGE TITLE
        // ==================================

        document.title =
            (
                story.title ||
                "Story"
            )
            +
            " | කතා අරණ";



        // ==================================
        // COVER
        // ==================================

        let coverHTML =
            `<span>📖</span>`;


        if (story.cover) {

            coverHTML = `

                <img
                    src="${escapeHTML(
                        story.cover
                    )}"
                    alt="${escapeHTML(
                        story.title
                    )}"
                >

            `;

        }



        // ==================================
        // STORY INFO
        // ==================================

        storyInfo.innerHTML = `

            <div class="reader-cover cover">

                ${coverHTML}

            </div>


            <div class="reader-info">

                <p class="label">

                    ${escapeHTML(
                        story.category || ""
                    )}

                </p>


                <h1>

                    ${escapeHTML(
                        story.title ||
                        "Untitled Story"
                    )}

                </h1>


                <p class="author">

                    ✍️

                    ${escapeHTML(
                        story.author ||
                        "කතා අරණ"
                    )}

                </p>


                <p class="description">

                    ${escapeHTML(
                        story.description ||
                        ""
                    )}

                </p>


                <div class="story-meta">

                    <span>

                        👁️
                        ${Number(
                            story.views || 0
                        )}

                    </span>


                    <span>

                        ⭐
                        ${Number(
                            story.rating || 0
                        )}

                    </span>

                </div>


                <div class="reader-controls">


                    <button
                        onclick="toggleLike()"
                        id="likeButton"
                        type="button"
                    >

                        🤍 Like

                    </button>



                    <button
                        onclick="toggleBookmark()"
                        id="bookmarkButton"
                        type="button"
                    >

                        🔖 Bookmark

                    </button>



                    <button
                        onclick="changeFontSize(-1)"
                        type="button"
                    >

                        A−

                    </button>



                    <button
                        onclick="changeFontSize(1)"
                        type="button"
                    >

                        A+

                    </button>



                    <button
                        onclick="toggleReadingMode()"
                        type="button"
                    >

                        🌙 Reading Mode

                    </button>


                </div>

            </div>

        `;



        // ==================================
        // LOAD CHAPTERS
        // ==================================

        await loadChapters();



        // ==================================
        // BUTTON STATES
        // ==================================

        updateReaderButtons();

    }

    catch (error) {

        console.error(
            "Load story error:",
            error
        );

        showStoryError(
            error.message
        );

    }

}



// ==========================================
// LOAD CHAPTERS
// ==========================================

async function loadChapters() {

    try {

        const {
            data,
            error
        } = await supabaseClient

            .from("chapters")

            .select("*")

            .eq(
                "story_id",
                storyId
            )

            .order(
                "number",
                {
                    ascending: true
                }
            );


        if (error) {

            console.error(
                "Chapter error:",
                error
            );


            chapterList.innerHTML = `

                <p style="
                    color:#ff8585;
                    padding:15px 0;
                ">

                    ❌ Chapters load කරන්න බැරි වුණා.

                </p>

            `;

            return;

        }


        currentChapters =
            data || [];


        displayChapters();

    }

    catch (error) {

        console.error(
            "Load chapters error:",
            error
        );

    }

}



// ==========================================
// DISPLAY CHAPTERS
// ==========================================

function displayChapters() {

    chapterList.innerHTML =
        "";


    if (
        currentChapters.length === 0
    ) {

        chapterList.innerHTML = `

            <p
                style="
                    color:#888;
                    padding:15px 0;
                "
            >

                තවම Chapter එකක්
                publish කරලා නැහැ. 📖

            </p>

        `;

        return;

    }



    currentChapters.forEach(
        function(chapter) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "chapter-button";


            button.innerHTML = `

                📖 Chapter

                ${escapeHTML(
                    chapter.number
                )}

                —

                ${escapeHTML(
                    chapter.title ||
                    "Untitled Chapter"
                )}

            `;


            button.onclick =
                function() {

                    openChapter(
                        chapter
                    );

                };


            chapterList.appendChild(
                button
            );

        }
    );

}



// ==========================================
// OPEN CHAPTER
// ==========================================

function openChapter(chapter) {

    chapterArea.innerHTML = `

        <p class="label">

            CHAPTER
            ${escapeHTML(
                chapter.number
            )}

        </p>


        <h2>

            ${escapeHTML(
                chapter.title ||
                "Chapter"
            )}

        </h2>


        <div
            class="chapter-content"
        >

            ${chapter.content || ""}

        </div>


        <div class="chapter-buttons">


            <button
                type="button"
                class="read-btn"
                onclick="
                    previousChapter(
                        ${Number(
                            chapter.number
                        )}
                    )
                "
            >

                ← Previous

            </button>



            <button
                type="button"
                class="read-btn"
                onclick="
                    nextChapter(
                        ${Number(
                            chapter.number
                        )}
                    )
                "
            >

                Next →

            </button>


        </div>

    `;


    applyFontSize();


    chapterArea.scrollIntoView({
        behavior: "smooth"
    });

}



// ==========================================
// PREVIOUS CHAPTER
// ==========================================

window.previousChapter =
    function(number) {

        const index =
            currentChapters.findIndex(
                function(chapter) {

                    return Number(
                        chapter.number
                    )
                    ===
                    Number(number);

                }
            );


        if (index > 0) {

            openChapter(
                currentChapters[
                    index - 1
                ]
            );

        }

    };



// ==========================================
// NEXT CHAPTER
// ==========================================

window.nextChapter =
    function(number) {

        const index =
            currentChapters.findIndex(
                function(chapter) {

                    return Number(
                        chapter.number
                    )
                    ===
                    Number(number);

                }
            );


        if (
            index !== -1
            &&
            index <
            currentChapters.length - 1
        ) {

            openChapter(
                currentChapters[
                    index + 1
                ]
            );

        }

    };



// ==========================================
// LIKE
// ==========================================

window.toggleLike =
    function() {

        const key =
            "liked_" +
            storyId;


        const liked =
            localStorage.getItem(
                key
            )
            ===
            "true";


        localStorage.setItem(
            key,
            String(!liked)
        );


        updateReaderButtons();

    };



// ==========================================
// BOOKMARK
// ==========================================

window.toggleBookmark =
    function() {

        const key =
            "bookmark_" +
            storyId;


        const bookmarked =
            localStorage.getItem(
                key
            )
            ===
            "true";


        localStorage.setItem(
            key,
            String(!bookmarked)
        );


        updateReaderButtons();

    };



// ==========================================
// FONT SIZE
// ==========================================

window.changeFontSize =
    function(amount) {

        readerFontSize +=
            amount;


        if (
            readerFontSize < 15
        ) {

            readerFontSize =
                15;

        }


        if (
            readerFontSize > 30
        ) {

            readerFontSize =
                30;

        }


        applyFontSize();

    };



// ==========================================
// APPLY FONT
// ==========================================

function applyFontSize() {

    const content =
        document.querySelector(
            ".chapter-content"
        );


    if (content) {

        content.style.fontSize =
            readerFontSize +
            "px";

    }

}



// ==========================================
// READING MODE
// ==========================================

window.toggleReadingMode =
    function() {

        document.body
            .classList
            .toggle(
                "reading-mode"
            );

    };



// ==========================================
// BUTTON STATES
// ==========================================

function updateReaderButtons() {

    const likeButton =
        document.getElementById(
            "likeButton"
        );


    const bookmarkButton =
        document.getElementById(
            "bookmarkButton"
        );


    if (
        !likeButton
        ||
        !bookmarkButton
    ) {

        return;

    }


    const liked =
        localStorage.getItem(
            "liked_" +
            storyId
        )
        ===
        "true";


    const bookmarked =
        localStorage.getItem(
            "bookmark_" +
            storyId
        )
        ===
        "true";


    likeButton.innerText =
        liked
            ? "❤️ Liked"
            : "🤍 Like";


    bookmarkButton.innerText =
        bookmarked
            ? "🔖 Saved"
            : "🔖 Bookmark";

}



// ==========================================
// STORY NOT FOUND
// ==========================================

function showStoryNotFound() {

    storyInfo.innerHTML = `

        <div
            style="
                width:100%;
                text-align:center;
                padding:60px 20px;
            "
        >

            <h1>
                😕 Story එක හම්බ වුණේ නැහැ.
            </h1>


            <p
                style="
                    color:#888;
                    margin:20px 0;
                "
            >

                මේ story එක හොයාගන්න බැහැ.

            </p>


            <a
                href="index.html"
                class="read-btn"
            >

                ← Home Page

            </a>

        </div>

    `;


    chapterList.innerHTML =
        "";

}



// ==========================================
// STORY ERROR
// ==========================================

function showStoryError(errorMessage) {

    storyInfo.innerHTML = `

        <div
            style="
                width:100%;
                text-align:center;
                padding:60px 20px;
            "
        >

            <h1>
                ❌ Story එක load කරන්න බැරි වුණා.
            </h1>


            <p
                style="
                    color:#888;
                    margin:20px 0;
                "
            >

                කරුණාකර නැවත උත්සාහ කරන්න.

            </p>

        </div>

    `;


    console.error(
        "Supabase:",
        errorMessage
    );

}



// ==========================================
// START
// ==========================================

loadStory();


</script>


</body>

</html>
```
