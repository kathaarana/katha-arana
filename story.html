<!DOCTYPE html>
<html lang="si">

<head>

    <meta charset="UTF-8">

    <meta

        href="style.css"

    <style>

        /* =========================================
           STORY PAGE
        ========================================= */

        .story-page-header {
            width: 100%;
            min-height: 65px;
            padding: 12px 20px;
            box-sizing: border-box;

            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;

            background: rgba(0,0,0,0.25);

            border-bottom:
                1px solid
                rgba(255,255,255,0.08);
        }


        .story-page-logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 20px;
            font-weight: 700;
        }


        .story-page-header nav {
            display: flex;
            align-items: center;
        }


        .story-page-header nav a {
            text-decoration: none;
            color: inherit;

            padding: 9px 14px;

            border-radius: 9px;

            background:

            transition: 0.2s;

        .story-page-header nav a:hover {

                rgba(255,255,255,0.12);
        }



        /* =========================================
           STORY READER
        ========================================= */

        .story-reader {
            display: grid;

            grid-template-columns:
                240px 1fr;

            gap: 35px;

            align-items: start;
        }


        .reader-cover {
            width: 100%;
            max-width: 240px;

            aspect-ratio: 2 / 3;

            border-radius: 16px;

            overflow: hidden;

            background:
                rgba(255,255,255,0.05);

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 50px;
        }


        .reader-cover img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        .reader-info h1 {
            margin-top: 5px;
            margin-bottom: 12px;
        }


        .reader-info .author {
            color: #aaa;
            margin-bottom: 18px;
        }


        .reader-info .description {
            color: #aaa;
            line-height: 1.8;
        }


        .reader-controls {
            display: flex;

            flex-wrap: wrap;

            gap: 9px;

            margin-top: 22px;
        }


        .reader-controls button {
            border: none;

            padding: 10px 14px;

            border-radius: 9px;

            cursor: pointer;

            background:
                rgba(255,255,255,0.08);

            color: inherit;

            transition: 0.2s;
        }


        .reader-controls button:hover {
            background:
                rgba(255,255,255,0.15);
        }



        /* =========================================
           CHAPTER LIST
        ========================================= */

        #chapterList {
            display: grid;

            gap: 10px;
        }


        .chapter-button {
            width: 100%;

            text-align: left;

            padding: 15px 17px;

            border:
                1px solid
                rgba(255,255,255,0.08);

            border-radius: 12px;

            background:
                rgba(255,255,255,0.04);

            color: inherit;

            cursor: pointer;

            transition: 0.2s;

            font-size: 15px;
        }


        .chapter-button:hover {
            background:
                rgba(255,255,255,0.09);

            transform:
                translateX(3px);
        }



        /* =========================================
           READING AREA
        ========================================= */

        .reading-area {
            padding: 30px;

            border-radius: 18px;

            background:
                rgba(255,255,255,0.035);

            border:
                1px solid
                rgba(255,255,255,0.07);
        }


        .chapter-content {
            font-size: 19px;

            line-height: 1.9;

            color: inherit;

            white-space: normal;

            overflow-wrap: anywhere;

            margin-top: 25px;
        }


        .chapter-content p {
            margin-bottom: 22px;
        }


        .chapter-buttons {
            display: flex;

            gap: 10px;

            margin-top: 30px;

            flex-wrap: wrap;
        }


        .read-btn {
            display: inline-block;

            border: none;

            padding: 11px 17px;

            border-radius: 10px;

            cursor: pointer;

            background:
                rgba(255,255,255,0.1);

            color: inherit;

            text-decoration: none;

            transition: 0.2s;
        }


        .read-btn:hover {
            background:
                rgba(255,255,255,0.17);
        }



        /* =========================================
           FULL READING MODE
           HEADER SPACE COMPLETELY REMOVED
        ========================================= */

        body.reading-mode {
            padding: 0 !important;
            margin: 0 !important;
        }


        body.reading-mode .story-page-header,
        body.reading-mode footer,
        body.reading-mode #storyInfo,
        body.reading-mode #chapterListSection {
            display: none !important;
        }


        body.reading-mode .section {
            width: 100% !important;

            max-width: 100% !important;

            margin: 0 !important;

            padding:
                25px
                6% !important;
        }


        body.reading-mode .reading-area {
            width: 100% !important;

            max-width: 950px !important;

            margin:
                0 auto !important;

            padding:
                25px 0 !important;

            border: none !important;

            background: transparent !important;

            box-shadow: none !important;
        }


        body.reading-mode .chapter-content {
            max-width: 900px;

            margin-left: auto;
            margin-right: auto;
        }



        /* =========================================
           WHEN CHAPTER IS OPEN
           AUTOMATIC READING MODE
        ========================================= */

        body.auto-reading-mode .story-page-header,
        body.auto-reading-mode footer,
        body.auto-reading-mode #storyInfo,
        body.auto-reading-mode #chapterListSection {
            display: none !important;
        }


        body.auto-reading-mode .section {
            width: 100% !important;

            max-width: 100% !important;

            margin: 0 !important;

            padding:
                25px
                6% !important;
        }


        body.auto-reading-mode .reading-area {
            width: 100% !important;

            max-width: 950px !important;

            margin:
                0 auto !important;

            padding:
                25px 0 !important;

            border: none !important;

            background: transparent !important;

            box-shadow: none !important;
        }



        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 700px) {

            .story-page-header {
                min-height: 58px;

                padding:
                    10px 14px;
            }


            .story-page-logo {
                font-size: 17px;
            }


            .story-page-header nav a {
                font-size: 13px;

                padding:
                    8px 10px;
            }


            .story-reader {
                grid-template-columns: 1fr;

                gap: 25px;
            }


            .reader-cover {
                width: 180px;

                margin: 0 auto;

            .reader-info {
                text-align: center;

            .reader-controls {
                justify-content: center;

                justify-content: center;

            .reading-area {

            .chapter-content {

                line-height: 1.85;
            }


            body.reading-mode .section,
            body.auto-reading-mode .section {
                padding:
                    20px 18px !important;
            }

        }

    </style>

</head>

<!-- =====================================================
     STORY SCRIPT
===================================================== -->

<script>


// =====================================================
// GET STORY ID
// =====================================================

const params =
    new URLSearchParams(
        window.location.search
    );


const storyId =
    params.get("id");



// =====================================================
// ELEMENTS
// =====================================================

const storyInfo =
    document.getElementById(
        "storyInfo"
    );


const chapterList =
    document.getElementById(
        "chapterList"
    );


const chapterArea =
    document.getElementById(
        "chapterArea"
    );



// =====================================================
// VARIABLES
// =====================================================

let currentStory = null;

let currentChapters = [];

let readerFontSize = 19;



// =====================================================
// LOAD STORY
// =====================================================

async function loadStory() {

    try {

        if (!storyId) {

            showStoryNotFound();

            return;

        }


        const {
            data: story,
            error: storyError
        } =
            await supabaseClient
                .from("stories")
                .select("*")
                .eq(
                    "id",
                    storyId
                )
                .single();


        if (storyError) {

            console.error(
                "Story load error:",
                storyError
            );

            showStoryNotFound();

            return;

        }


        if (!story) {

            showStoryNotFound();

            return;

        }



        // =============================================
        // 18+
        // =============================================

        const isAdultStory =
            String(
                story.category || ""
            )
            .trim()
            .toLowerCase()
            ===
            "18+";


        if (isAdultStory) {

            const confirmed =
                confirm(
                    "🔞 18+ Content\n\n" +
                    "මෙම කතාව වැඩිහිටියන් සඳහා පමණි.\n\n" +
                    "ඔබට ඉදිරියට යාමට අවශ්‍යද?"
                );


            if (!confirmed) {

                window.location.href =
                    "index.html";

                return;

            }

        }



        currentStory =
            story;


        document.title =
            (
                story.title ||
                "Story"
            )
            +
            " | කතා අරණ";



        displayStory(
            story
        );



        // =============================================
        // VIEW COUNT
        // =============================================

        const {
            data: newViews,
            error: viewError
        } =
            await supabaseClient.rpc(
                "increment_story_views",
                {
                    p_story_id:
                        story.id
                }
            );


        if (!viewError) {

            const viewsElement =
                document.getElementById(
                    "storyViews"
                );


            if (viewsElement) {

                viewsElement.innerText =
                    "👁️ " +
                    newViews;

            }

        }
        else {

            console.error(
                "View count error:",
                viewError
            );

        }



        await loadChapters(
            story.id
        );

    }

    catch (error) {

        console.error(
            "Unexpected error:",
            error
        );

        showStoryNotFound();

    }

}



// =====================================================
// DISPLAY STORY
// =====================================================

function displayStory(
    story
) {

    let coverHTML =
        "📖";


    if (
        story.cover &&
        String(
            story.cover
        ).trim() !== ""
    ) {

        coverHTML = `

            <img
                src="${escapeHTML(
                    story.cover
                )}"
                alt="${escapeHTML(
                    story.title ||
                    "Story"
                )}"
            >

        `;

    }


    const views =
        Number(
            story.views || 0
        );


    const rating =
        Number(
            story.rating || 0
        );


    storyInfo.innerHTML = `

        <div class="reader-cover">

            ${coverHTML}

        </div>


        <div class="reader-info">

            <p class="label">

                ${escapeHTML(
                    story.category ||
                    ""
                )}

            </p>


            <h1>

                ${escapeHTML(
                    story.title ||
                    "Untitled"
                )}

            </h1>


            <p class="author">

                ✍️

                ${escapeHTML(
                    story.author ||
                    "කතා අරණ"
                )}

            </p>


            <p class="description">

                ${escapeHTML(
                    story.description ||
                    ""
                )}

            </p>


            <div class="story-meta">

                <span id="storyViews">

                    👁️ ${views}

                </span>


                <span>

                    ⭐ ${rating}

                </span>

            </div>


            <div class="reader-controls">


                <button
                    onclick="toggleLike()"
                    id="likeButton"
                    type="button"
                >

                    🤍 Like

                </button>


                <button
                    onclick="toggleBookmark()"
                    id="bookmarkButton"
                    type="button"
                >

                    🔖 Bookmark

                </button>


                <button
                    onclick="changeFontSize(-1)"
                    type="button"
                >

                    A−

                </button>


                <button
                    onclick="changeFontSize(1)"
                    type="button"
                >

                    A+

                </button>


                <button
                    onclick="toggleReadingMode()"
                    type="button"
                >

                    🌙 Reading Mode

                </button>


            </div>

        </div>

    `;


    updateReaderButtons();

}



// =====================================================
// LOAD CHAPTERS
// =====================================================

async function loadChapters(
    storyId
) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
                .from("chapters")
                .select("*")
                .eq(
                    "story_id",
                    storyId
                )
                .order(
                    "number",
                    {
                        ascending:
                            true
                    }
                );


        if (error) {

            console.error(
                "Chapter load error:",
                error
            );


            chapterList.innerHTML = `

                <p style="
                    color:#888;
                    padding:15px 0;
                ">

                    Chapters load කරන්න
                    බැරි වුණා. 😔

                </p>

            `;

            return;

        }


        currentChapters =
            data || [];


        displayChapters(
            currentChapters
        );

    }

    catch (error) {

        console.error(
            error
        );

    }

}



// =====================================================
// DISPLAY CHAPTERS
// =====================================================

function displayChapters(
    chapters
) {

    chapterList.innerHTML =
        "";


    if (
        !chapters ||
        chapters.length === 0
    ) {

        chapterList.innerHTML = `

            <p style="
                color:#888;
                padding:15px 0;
            ">

                තවම Chapter එකක්
                publish කරලා නැහැ. 📖

            </p>

        `;

        return;

    }


    chapters.forEach(
        function(chapter) {

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "chapter-button";


            button.innerHTML = `

                📖 Chapter

                ${escapeHTML(
                    chapter.number
                )}

                —

                ${escapeHTML(
                    chapter.title ||
                    "Untitled"
                )}

            `;


            button.addEventListener(
                "click",
                function() {

                    openChapter(
                        chapter
                    );

                }
            );


            chapterList.appendChild(
                button
            );

        }
    );

}



// =====================================================
// OPEN CHAPTER
// =====================================================

function openChapter(
    chapter
) {

    const currentIndex =
        currentChapters.findIndex(
            function(item) {

                return String(
                    item.id
                )
                ===
                String(
                    chapter.id
                );

            }
        );


    let buttonsHTML =
        "";


    if (
        currentIndex > 0
    ) {

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="previousChapterButton"
            >

                ← Previous

            </button>

        `;

    }


    if (
        currentIndex !== -1
        &&
        currentIndex <
        currentChapters.length - 1
    ) {

        buttonsHTML += `

            <button
                type="button"
                class="read-btn"
                id="nextChapterButton"
            >

                Next →

            </button>

        `;

    }


    chapterArea.innerHTML = `

        <p class="label">

            CHAPTER
            ${escapeHTML(
                chapter.number
            )}

        </p>


        <h2>

            ${escapeHTML(
                chapter.title ||
                "Untitled"
            )}

        </h2>


        <div class="chapter-content">

            ${chapter.content || ""}

        </div>


        <div class="chapter-buttons">

            ${buttonsHTML}

        </div>

    `;



    // =============================================
    // AUTOMATICALLY HIDE HEADER
    // =============================================

    document.body.classList.add(
        "auto-reading-mode"
    );



    // =============================================
    // PREVIOUS
    // =============================================

    const previousButton =
        document.getElementById(
            "previousChapterButton"
        );


    if (previousButton) {

        previousButton.addEventListener(
            "click",
            function() {

                openChapter(
                    currentChapters[
                        currentIndex - 1
                    ]
                );

            }
        );

    }



    // =============================================
    // NEXT
    // =============================================

    const nextButton =
        document.getElementById(
            "nextChapterButton"
        );


    if (nextButton) {

        nextButton.addEventListener(
            "click",
            function() {

                openChapter(
                    currentChapters[
                        currentIndex + 1
                    ]
                );

            }
        );

    }


    applyFontSize();



    // =============================================
    // SCROLL TO TOP OF READING AREA
    // =============================================

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}



// =====================================================
// LIKE
// =====================================================

function toggleLike() {

    if (!currentStory) {
        return;
    }


    const key =
        "liked_" +
        currentStory.id;


    const liked =
        localStorage.getItem(
            key
        )
        ===
        "true";


    localStorage.setItem(
        key,
        String(
            !liked
        )
    );


    updateReaderButtons();

}



// =====================================================
// BOOKMARK
// =====================================================

function toggleBookmark() {

    if (!currentStory) {
        return;
    }


    const key =
        "bookmark_" +
        currentStory.id;


    const bookmarked =
        localStorage.getItem(
            key
        )
        ===
        "true";


    localStorage.setItem(
        key,
        String(
            !bookmarked
        )
    );


    updateLibrary(
        currentStory.id,
        !bookmarked
    );


    updateReaderButtons();

}



// =====================================================
// LIBRARY
// =====================================================

function updateLibrary(
    id,
    add
) {

    let library = [];


    try {

        library =
            JSON.parse(
                localStorage.getItem(
                    "kathaLibrary"
                )
            ) || [];

    }

    catch (error) {

        library = [];

    }


    library =
        library.filter(
            function(item) {

                return String(item)
                    !==
                    String(id);

            }
        );


    if (add) {

        library.push(
            id
        );

    }


    localStorage.setItem(
        "kathaLibrary",
        JSON.stringify(
            library
        )
    );

}



// =====================================================
// UPDATE BUTTONS
// =====================================================

function updateReaderButtons() {

    if (!currentStory) {
        return;
    }


    const likeButton =
        document.getElementById(
            "likeButton"
        );


    const bookmarkButton =
        document.getElementById(
            "bookmarkButton"
        );


    const liked =
        localStorage.getItem(
            "liked_" +
            currentStory.id
        )
        ===
        "true";


    const bookmarked =
        localStorage.getItem(
            "bookmark_" +
            currentStory.id
        )
        ===
        "true";


    if (likeButton) {

        likeButton.innerText =
            liked
                ? "❤️ Liked"
                : "🤍 Like";

    }


    if (bookmarkButton) {

        bookmarkButton.innerText =
            bookmarked
                ? "🔖 Saved"
                : "🔖 Bookmark";

    }

}



// =====================================================
// FONT SIZE
// =====================================================

function changeFontSize(
    amount
) {

    readerFontSize +=
        amount;


    if (
        readerFontSize < 15
    ) {

        readerFontSize =
            15;

    }


    if (
        readerFontSize > 30
    ) {

        readerFontSize =
            30;

    }


    applyFontSize();

}



// =====================================================
// APPLY FONT SIZE
// =====================================================

function applyFontSize() {

    const content =
        document.querySelector(
            ".chapter-content"
        );


    if (content) {

        content.style.fontSize =
            readerFontSize +
            "px";


        content.style.lineHeight =
            "1.9";

    }

}



// =====================================================
// READING MODE

// =====================================================
// ESCAPE HTML
// =====================================================

function escapeHTML(
    value
) {

    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        value == null
            ? ""
            : String(value);


    return div.innerHTML;

}
